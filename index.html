<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Neon Bricks: Master Editor</title>
    <style>
        :root { --main: #00f3ff; --sec: #bc13fe; --bg: #0b0b10; --panel: #14141a; --text: #eee; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 450px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
        .header { padding: 15px; background: #000; border-bottom: 1px solid var(--main); display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index:20; }
        .header h2 { margin: 0; color: var(--main); font-size: 18px; text-transform: uppercase; letter-spacing: 2px; }

        /* TABS */
        .tabs { display: flex; background: #000; border-bottom: 1px solid #333; position: sticky; top: 55px; z-index: 20; }
        .tab { flex: 1; padding: 12px; background: transparent; border: none; color: #777; cursor: pointer; border-bottom: 2px solid transparent; font-weight: bold; }
        .tab.active { color: var(--main); border-bottom-color: var(--main); background: rgba(0, 243, 255, 0.05); }

        .content { padding: 20px; }
        .group { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .group h4 { margin: 0 0 10px 0; color: var(--sec); font-size: 14px; text-transform: uppercase; }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .col { flex: 1; }
        label { font-size: 11px; color: #aaa; display: block; margin-bottom: 4px; }
        
        input, select, textarea { background: #000; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; font-size: 13px; }
        input[type="color"] { height: 30px; padding: 0; cursor: pointer; }
        input:focus { border-color: var(--main); outline: none; }
        
        button { cursor: pointer; transition: 0.2s; }
        .btn-add { width: 100%; padding: 8px; background: transparent; border: 1px dashed var(--main); color: var(--main); margin-top: 5px; }
        .btn-del { background: #300; border: 1px solid #f00; color: #f00; width: 30px; height: 30px; border-radius: 4px; }
        
        /* PREVIEW AREA */
        .preview-area { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: #000; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 20px 20px; overflow-y: auto;}
        .preview-box { border: 1px solid #444; border-radius: 10px; overflow: hidden; background: #000; position: relative; min-height: 300px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .preview-label { position: absolute; top: 10px; left: 10px; background: var(--main); color: #000; padding: 2px 8px; font-size: 10px; border-radius: 4px; font-weight: bold; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }

        /* GENERATE BUTTON */
        .footer { padding: 15px; background: #111; border-top: 1px solid #333; }
        .btn-gen { width: 100%; padding: 15px; background: linear-gradient(90deg, var(--main), var(--sec)); border: none; color: #fff; font-weight: bold; font-size: 16px; border-radius: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-gen:hover { opacity: 0.9; transform: scale(1.01); }

        /* Level Card */
        .level-card { border-left: 3px solid var(--sec); padding-left: 10px; margin-bottom: 20px; position: relative; }
        .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header">
        <h2>Bricks Editor Pro</h2>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="setTab('general')">Главная</button>
        <button class="tab" onclick="setTab('visuals')">Визуал</button>
        <button class="tab" onclick="setTab('levels')">Уровни</button>
        <button class="tab" onclick="setTab('audio')">Аудио</button>
    </div>

    <div id="content">
        </div>
</div>

<div class="preview-area">
    <div class="preview-box" style="flex:1">
        <div class="preview-label">СТАРТОВЫЙ ЭКРАН</div>
        <iframe id="previewStart"></iframe>
    </div>
    <div class="preview-box" style="flex:1">
        <div class="preview-label">ОКНО ВОПРОСА (GAMEPLAY)</div>
        <iframe id="previewGame"></iframe>
    </div>
</div>

<textarea id="outputCode" style="display:none"></textarea>

<script>
// --- CONFIG STATE ---
const CFG = {
    start: {
        title: "GRAMMAR BRICKS",
        font: "'Courier New', monospace",
        size: 50,
        color: "#ffffff",
        neon: "#00ffff",
        btnText: "START GAME",
        winTitle: "VICTORY!",
        loseTitle: "GAME OVER"
    },
    game: {
        bgType: "transparent", // color, image
        bgVal: "#000000",
        lives: 3,
        time: 90,
        ballSpeed: 6,
        ballColor: "#ffffff",
        qFont: "'Comic Sans MS', cursive, sans-serif",
        qSize: 20,
        qColor: "#ffffff",
        qNeon: "#00ffff",
        winEffect: "fireworks" // fireworks, bubbles, flowers, stars
    },
    levels: [
        { 
            easyQ: "She ___ to school.\nI ___ apples.", 
            easyA: "goes|go|going\nlike|likes|liking", 
            hardQ: "If I ___ you...", 
            hardA: "were|was|am" 
        }
    ],
    audio: {
        music: null,
        correct: null,
        wrong: null,
        win: null,
        lose: null
    }
};

// --- TAB RENDERING ---
function setTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    renderContent(id);
}

function renderContent(tab) {
    const c = document.getElementById('content');
    c.innerHTML = '';

    if (tab === 'general') {
        c.innerHTML = `
            <div class="group">
                <h4>Стартовый Экран</h4>
                <div class="row"><div class="col"><label>Заголовок</label><input type="text" value="${CFG.start.title}" oninput="CFG.start.title=this.value; up()"></div></div>
                <div class="row">
                    <div class="col"><label>Шрифт</label>${fontSelect('CFG.start.font')}</div>
                    <div class="col"><label>Размер</label><input type="number" value="${CFG.start.size}" oninput="CFG.start.size=this.value; up()"></div>
                </div>
                <div class="row">
                    <div class="col"><label>Цвет текста</label><input type="color" value="${CFG.start.color}" oninput="CFG.start.color=this.value; up()"></div>
                    <div class="col"><label>Цвет неона</label><input type="color" value="${CFG.start.neon}" oninput="CFG.start.neon=this.value; up()"></div>
                </div>
            </div>
            <div class="group">
                <h4>Тексты финалов</h4>
                <div class="row"><div class="col"><label>Победа</label><input type="text" value="${CFG.start.winTitle}" oninput="CFG.start.winTitle=this.value;"></div></div>
                <div class="row"><div class="col"><label>Поражение</label><input type="text" value="${CFG.start.loseTitle}" oninput="CFG.start.loseTitle=this.value;"></div></div>
            </div>
            <div class="footer"><button class="btn-gen" onclick="generate()">Сгенерировать Код</button></div>
        `;
    } else if (tab === 'visuals') {
        c.innerHTML = `
            <div class="group">
                <h4>Фон Игры</h4>
                <select onchange="CFG.game.bgType=this.value; document.getElementById('bgInp').style.display=this.value==='color'?'block':'none'; document.getElementById('bgFile').style.display=this.value==='image'?'block':'none'; up();">
                    <option value="transparent" ${CFG.game.bgType==='transparent'?'selected':''}>Прозрачный (как сейчас)</option>
                    <option value="color" ${CFG.game.bgType==='color'?'selected':''}>Сплошной цвет</option>
                    <option value="image" ${CFG.game.bgType==='image'?'selected':''}>Своя картинка</option>
                </select>
                <input id="bgInp" type="color" value="${CFG.game.bgVal}" style="display:${CFG.game.bgType==='color'?'block':'none'}" oninput="CFG.game.bgVal=this.value; up()">
                <input id="bgFile" type="file" style="display:${CFG.game.bgType==='image'?'block':'none'}" onchange="encodeImg(this)">
            </div>
            <div class="group">
                <h4>Окно Вопроса</h4>
                <div class="row">
                    <div class="col"><label>Шрифт</label>${fontSelect('CFG.game.qFont', CFG.game.qFont)}</div>
                    <div class="col"><label>Размер</label><input type="number" value="${CFG.game.qSize}" oninput="CFG.game.qSize=this.value; up()"></div>
                </div>
                <div class="row">
                    <div class="col"><label>Текст</label><input type="color" value="${CFG.game.qColor}" oninput="CFG.game.qColor=this.value; up()"></div>
                    <div class="col"><label>Рамка (Неон)</label><input type="color" value="${CFG.game.qNeon}" oninput="CFG.game.qNeon=this.value; up()"></div>
                </div>
            </div>
            <div class="group">
                <h4>Геймплей</h4>
                 <div class="row">
                    <div class="col"><label>Жизни</label><input type="number" value="${CFG.game.lives}" oninput="CFG.game.lives=this.value;"></div>
                    <div class="col"><label>Таймер (сек)</label><input type="number" value="${CFG.game.time}" oninput="CFG.game.time=this.value;"></div>
                </div>
                 <div class="row">
                    <div class="col"><label>Скорость шара</label><input type="number" value="${CFG.game.ballSpeed}" oninput="CFG.game.ballSpeed=this.value;"></div>
                    <div class="col"><label>Цвет шара</label><input type="color" value="${CFG.game.ballColor}" oninput="CFG.game.ballColor=this.value; up()"></div>
                </div>
                <div class="row">
                    <div class="col"><label>Эффект Победы</label>
                        <select onchange="CFG.game.winEffect=this.value">
                            <option value="fireworks" ${CFG.game.winEffect==='fireworks'?'selected':''}>Салют</option>
                            <option value="bubbles" ${CFG.game.winEffect==='bubbles'?'selected':''}>Пузырьки</option>
                            <option value="flowers" ${CFG.game.winEffect==='flowers'?'selected':''}>Цветочки</option>
                            <option value="stars" ${CFG.game.winEffect==='stars'?'selected':''}>Звездочки</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="footer"><button class="btn-gen" onclick="generate()">Сгенерировать Код</button></div>
        `;
    } else if (tab === 'levels') {
        let html = '<div id="lvl-container">';
        CFG.levels.forEach((l, i) => {
            html += `
            <div class="level-card">
                <div class="level-header">
                    <h4 style="margin:0; color:#fff">Уровень ${i+1}</h4>
                    <button class="btn-del" onclick="delLevel(${i})">🗑️</button>
                </div>
                <label style="color:#0f0">Зеленые (Easy) - 1 вопрос на строку</label>
                <textarea rows="3" oninput="CFG.levels[${i}].easyQ=this.value">${l.easyQ}</textarea>
                <label>Ответы (Верный|Неверный|Неверный)</label>
                <textarea rows="3" oninput="CFG.levels[${i}].easyA=this.value">${l.easyA}</textarea>
                
                <label style="color:#ff0; margin-top:10px;">Желтые (Hard) - 1 вопрос на строку</label>
                <textarea rows="3" oninput="CFG.levels[${i}].hardQ=this.value">${l.hardQ}</textarea>
                <label>Ответы (Верный|Неверный|Неверный)</label>
                <textarea rows="3" oninput="CFG.levels[${i}].hardA=this.value">${l.hardA}</textarea>
            </div>
            <hr style="border-color:#333">`;
        });
        html += '</div><button class="btn-add" onclick="addLevel()">+ Добавить Уровень</button>';
        html += '<div class="footer" style="margin-top:20px"><button class="btn-gen" onclick="generate()">Сгенерировать Код</button></div>';
        c.innerHTML = html;
    } else if (tab === 'audio') {
        c.innerHTML = `
            <div class="group">
                <h4>Звуки (MP3/WAV)</h4>
                <p style="font-size:10px; color:#777">Если не загрузить, будут стандартные звуки.</p>
                <div class="row"><label>✅ Правильный ответ</label><input type="file" onchange="encodeAudio(this, 'correct')"></div>
                <div class="row"><label>❌ Ошибка</label><input type="file" onchange="encodeAudio(this, 'wrong')"></div>
                <div class="row"><label>🏆 Победа</label><input type="file" onchange="encodeAudio(this, 'win')"></div>
                <div class="row"><label>💀 Провал</label><input type="file" onchange="encodeAudio(this, 'lose')"></div>
            </div>
            <div class="footer"><button class="btn-gen" onclick="generate()">Сгенерировать Код</button></div>
        `;
    }
}

// --- HELPERS ---
function fontSelect(bind, selected) {
    const fonts = ["'Courier New', monospace", "Arial, sans-serif", "'Comic Sans MS', cursive, sans-serif", "'Times New Roman', serif", "Verdana, sans-serif"];
    let h = `<select onchange="${bind}=this.value; up()">`;
    fonts.forEach(f => {
        h += `<option value="${f}" ${f===selected?'selected':''}>${f.split(',')[0].replace(/'/g,'')}</option>`;
    });
    return h + '</select>';
}

function up() { updatePreviews(); }

function addLevel() {
    CFG.levels.push({ easyQ: "", easyA: "", hardQ: "", hardA: "" });
    renderContent('levels');
}

function delLevel(i) {
    if (CFG.levels.length <= 1) return alert("Минимум 1 уровень!");
    CFG.levels.splice(i, 1);
    renderContent('levels');
}

function encodeImg(inp) {
    const f = inp.files[0];
    if(f) { const r = new FileReader(); r.onload = e => { CFG.game.bgVal = e.target.result; up(); }; r.readAsDataURL(f); }
}

function encodeAudio(inp, key) {
    const f = inp.files[0];
    if(f) { const r = new FileReader(); r.onload = e => { CFG.audio[key] = e.target.result; alert('Звук сохранен!'); }; r.readAsDataURL(f); }
}

// --- PREVIEWS LOGIC ---
function updatePreviews() {
    const s = CFG.start;
    const g = CFG.game;

    // Start Screen HTML
    const startCSS = `
        body { background: #000; margin:0; display:flex; justify-content:center; align-items:center; height:100vh; font-family: ${s.font}; }
        .panel { border: 3px solid ${s.neon}; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 0 20px ${s.neon}, inset 0 0 20px rgba(0,0,0,0.5); background: rgba(20,20,25,0.9); }
        h1 { color: ${s.color}; font-size: ${s.size}px; margin: 0 0 20px; text-shadow: 0 0 10px ${s.neon}; }
        .btn { border: 2px solid ${s.neon}; color: ${s.neon}; background: transparent; padding: 10px 30px; font-size: 20px; font-family: inherit; font-weight: bold; border-radius: 30px; box-shadow: 0 0 10px ${s.neon}; }
    `;
    const startHTML = `<html><head><style>${startCSS}</style></head><body><div class="panel"><h1>${s.title}</h1><button class="btn">${s.btnText}</button></div></body></html>`;
    document.getElementById('previewStart').srcdoc = startHTML;

    // Game/Question HTML
    const bgStyle = g.bgType === 'color' ? `background:${g.bgVal}` : (g.bgType === 'image' ? `background:url('${g.bgVal}') center/cover` : 'background:transparent');
    const qCSS = `
        body { ${bgStyle}; margin:0; display:flex; justify-content:center; align-items:center; height:100vh; font-family: ${g.qFont}; overflow:hidden; }
        .ball { width:15px; height:15px; background:${g.ballColor}; border-radius:50%; position:absolute; bottom:100px; left:50%; box-shadow:0 0 10px ${g.ballColor}; }
        .paddle { width:100px; height:15px; background:#fff; position:absolute; bottom:50px; left:calc(50% - 50px); box-shadow:0 0 10px ${g.qNeon}; }
        .q-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; }
        .q-box { width: 80%; max-width:400px; border: 3px solid ${g.qNeon}; background: #111; padding: 20px; border-radius: 15px; box-shadow: 0 0 25px ${g.qNeon}; color: ${g.qColor}; text-align: center; }
        .q-text { font-size: ${g.qSize}px; margin-bottom: 20px; }
        .ans { background: rgba(255,255,255,0.1); border: 1px solid #555; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; }
        .ans:hover { border-color: ${g.qNeon}; background: rgba(255,255,255,0.2); }
    `;
    const gameHTML = `<html><head><style>${qCSS}</style></head><body>
        <div class="ball"></div><div class="paddle"></div>
        <div class="q-overlay"><div class="q-box"><div class="q-text">Is this preview working?</div><div class="ans">Yes</div><div class="ans">No</div></div></div>
    </body></html>`;
    document.getElementById('previewGame').srcdoc = gameHTML;
}

// --- GENERATOR CORE ---
function generate() {
    // Preparing Data
    const c = CFG;
    const cleanLevels = JSON.stringify(c.levels.map(l => ({
        easyQ: l.easyQ.split('\n').filter(x=>x), easyA: l.easyA.split('\n').filter(x=>x),
        hardQ: l.hardQ.split('\n').filter(x=>x), hardA: l.hardA.split('\n').filter(x=>x)
    })));
    const cleanAudio = JSON.stringify(c.audio);

    // This is the TEMPLATE based on your "File 9" but injected with variables
    const finalCode = `

<head>

<body>

<div id="game-container">
    <canvas id="cvs"></canvas>
    
    <div id="hud" class="hidden">
        SCORE: <span id="sc">0</span> | LIVES: <span id="lv"></span> | TIME: <span id="tm"></span>
    </div>

    <div id="start-screen" class="overlay">
        <div class="panel">

<script>
// --- INJECTED CONFIG ---
const CFG = { 
    speed: ${c.game.ballSpeed}, 
    time: ${c.game.time}, 
    lives: ${c.game.lives}, 
    ballC: '${c.game.ballColor}', 
    winEff: '${c.game.winEffect}',
    winTxt: '${c.start.winTitle}',
    loseTxt: '${c.start.loseTitle}'
};
const LEVELS = ${cleanLevels};
const AUD = ${cleanAudio};

// --- GAME ENGINE (Based on your "File 9") ---
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let w, h, paddle, ball, bricks=[], particles=[], timer, timeLeft, stats={sc:0, lv:3, lvl:0};
let state = 'START';
let audioCtx = null;

// AUDIO SYSTEM
function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playSnd(type) {
    if(!audioCtx) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    
    // Check Custom Files
    if(type==='win' && AUD.win) return playFile(AUD.win);
    if(type==='lose' && AUD.lose) return playFile(AUD.lose);
    if(type==='correct' && AUD.correct) return playFile(AUD.correct);
    if(type==='wrong' && AUD.wrong) return playFile(AUD.wrong);

    // Fallback Synths (Original logic)
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    
    if(type==='hit') { o.type='sine'; o.frequency.setValueAtTime(400, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime+0.1); }
    else if(type==='tick') { o.type='square'; o.frequency.value=800; g.gain.value=0.05; o.start(); o.stop(audioCtx.currentTime+0.05); return;} 
    else if(type==='correct') { o.type='triangle'; o.frequency.setValueAtTime(600, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime+0.3); }
    else { o.type='sawtooth'; o.frequency.setValueAtTime(300, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(100, audioCtx.currentTime+0.3); }
    
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.3);
    o.start(); o.stop(audioCtx.currentTime+0.3);
}
function playFile(src) {
    fetch(src).then(r=>r.arrayBuffer()).then(d=>audioCtx.decodeAudioData(d, b=>{
        const s=audioCtx.createBufferSource(); s.buffer=b; s.connect(audioCtx.destination); s.start(0);
    }));
}

// LOGIC
function resize() { 
    w=cvs.width=document.getElementById('game-container').offsetWidth; 
    h=cvs.height=document.getElementById('game-container').offsetHeight; 
    paddle={x:w/2-60, y:h-40, w:120, h:15}; 
    if(state!=='PLAY') resetBall();
}
window.onresize = resize;

function initBricks() {
    bricks = [];
    const lvl = LEVELS[stats.lvl % LEVELS.length];
    let pool = [];
    // Populate pool (Green/Yellow)
    lvl.easyQ.forEach((q,i)=>pool.push({q, a:lvl.easyA[i], t:'g'}));
    lvl.hardQ.forEach((q,i)=>pool.push({q, a:lvl.hardA[i], t:'y'}));
    
    // Auto-Rows Logic: If questions > 10, increase rows
    let totalQ = pool.length;
    let rows = totalQ > 10 ? Math.min(16, Math.ceil(totalQ/2) + 6) : 8;
    let cols = 6, bw = w/cols, bh = h*0.04;

    // Fill grid
    for(let r=0; r<rows; r++) {
        let qIdx = (pool.length > 0 && Math.random() > 0.4) ? Math.floor(Math.random()*cols) : -1;
        for(let c=0; c<cols; c++) {
            let b = {x:c*bw+2, y:r*(bh+5)+60, w:bw-4, h:bh, a:true, type:'n', col:'rgba(255,255,255,0.1)'};
            if(c === qIdx && pool.length>0) {
                let p = pool.shift();
                b.type = p.t; b.q = p; b.col = p.t==='g' ? '#0f0' : '#ff0';
            } else if(Math.random()<0.1) {
                b.type = 'b'; b.col = '#0cf';
            }
            bricks.push(b);
        }
    }
}

function resetBall() { ball={x:paddle.x+paddle.w/2, y:paddle.y-20, r:8, dx:0, dy:0, mov:false}; }

function update() {
    if(state!=='PLAY') return;
    
    // Paddle
    if(keys.ArrowLeft) paddle.x-=10;
    if(keys.ArrowRight) paddle.x+=10;
    if(paddle.x<0) paddle.x=0; if(paddle.x>w-paddle.w) paddle.x=w-paddle.w;
    if(!ball.mov) ball.x = paddle.x+paddle.w/2;

    // Ball
    if(ball.mov) {
        ball.x+=ball.dx; ball.y+=ball.dy;
        if(ball.x<0 || ball.x>w) { ball.dx*=-1; playSnd('hit'); }
        if(ball.y<0) { ball.dy*=-1; playSnd('hit'); }
        
        // Paddle Hit
        if(ball.y+ball.r>paddle.y && ball.x>paddle.x && ball.x<paddle.x+paddle.w) {
            ball.dy = -Math.abs(ball.dy);
            ball.dx = (ball.x-(paddle.x+paddle.w/2))*0.2;
            playSnd('hit');
        }

        // Brick Hit
        let hit = false;
        bricks.forEach(b => {
            if(!b.a || hit) return;
            if(ball.x>b.x && ball.x<b.x+b.w && ball.y>b.y && ball.y<b.y+b.h) {
                ball.dy*=-1; hit=true;
                if(b.type === 'n') { b.a=false; stats.sc+=10; playSnd('hit'); }
                else if(b.type === 'b') { b.a=false; stats.sc+=50; playSnd('hit'); }
                else { ask(b); }
            }
        });

        if(ball.y > h) {
            stats.lv--; updHUD(); playSnd('wrong');
            document.getElementById('game-container').classList.add('shake');
            setTimeout(()=>document.getElementById('game-container').classList.remove('shake'), 400);
            if(stats.lv<=0) end(false);
            else { resetBall(); }
        }
    }

    // Particles
    particles.forEach((p,i) => {
        p.x+=p.dx; p.y+=p.dy; p.l-=0.015;
        if(p.l<=0) particles.splice(i,1);
    });
}

function draw() {
    ctx.clearRect(0,0,w,h);
    
    // Paddle
    ctx.fillStyle='#fff'; ctx.shadowBlur=15; ctx.shadowColor='${c.start.neon}';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.shadowBlur=0;

    // Ball
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle=CFG.ballC; ctx.fill();

    // Bricks
    bricks.forEach(b => {
        if(!b.a) return;
        ctx.strokeStyle = b.col; ctx.lineWidth=2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        if(b.type!=='n') {
            ctx.fillStyle='#fff'; ctx.font='14px Arial'; ctx.fillText(b.type==='b'?'★':'?', b.x+b.w/2-4, b.y+b.h/2+5);
        }
    });

    // Particles (CUSTOM SHAPES)
    particles.forEach(p => {
        ctx.globalAlpha = p.l; ctx.fillStyle = p.c;
        if(CFG.winEff === 'bubbles') { ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); }
        else if(CFG.winEff === 'stars') { ctx.font=p.s*3+'px Arial'; ctx.fillText('★', p.x, p.y); }
        else if(CFG.winEff === 'flowers') { ctx.font=p.s*3+'px Arial'; ctx.fillText('✿', p.x, p.y); }
        else { ctx.fillRect(p.x,p.y,p.s,p.s); } // Fireworks default
    });
    ctx.globalAlpha=1;
}

function ask(b) {
    state='Q';
    const qBox = document.getElementById('q-screen');
    qBox.classList.remove('hidden');
    document.getElementById('q-text').innerText = b.q.q;
    
    const ansDiv = document.getElementById('q-ans'); ansDiv.innerHTML = '';
    const raw = b.q.a.split('|');
    const cor = raw[0];
    
    // Shuffle answers
    raw.sort(()=>Math.random()-0.5).forEach(txt => {
        const btn = document.createElement('button');
        btn.className = 'ans-btn';
        btn.innerText = txt;
        btn.onclick = () => {
            qBox.classList.add('hidden');
            if(txt === cor) {
                b.a = false; stats.sc+=100; playSnd('correct');
                // Row clear mechanic (simplified)
                bricks.forEach(br => { if(Math.abs(br.y - b.y) < 5) br.a = false; });
            } else {
                stats.lv--; updHUD(); playSnd('wrong');
                if(stats.lv<=0) end(false);
            }
            if(state !== 'END') state = 'PLAY';
        };
        ansDiv.appendChild(btn);
    });
}

function startGame() {
    initAudio();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    stats.lv = CFG.lives;
    timeLeft = CFG.time;
    stats.sc = 0;
    
    resize(); initBricks(); resetBall(); updHUD();
    
    state = 'PLAY';
    clearInterval(timer);
    timer = setInterval(() => {
        if(state === 'PLAY') {
            timeLeft--;
            updHUD();
            // TICKING LOGIC
            if(timeLeft <= 5 && timeLeft > 0) playSnd('tick');
            if(timeLeft <= 0) end(false);
        }
    }, 1000);
    
    loop();
}

function end(win) {
    state = 'END'; clearInterval(timer);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    
    const h1 = document.getElementById('end-title');
    h1.innerText = win ? CFG.winTxt : CFG.loseTxt;
    h1.style.color = win ? '#0f0' : '#f00';
    document.getElementById('end-score').innerText = stats.sc;
    
    playSnd(win ? 'win' : 'lose');
    if(win) setInterval(spawnFireworks, 500);
}

function spawnFireworks() {
    for(let i=0; i<30; i++) {
        particles.push({
            x: Math.random()*w, y: Math.random()*h,
            dx: (Math.random()-0.5)*5, dy: (Math.random()-0.5)*5,
            l: 1, s: Math.random()*5+2,
            c: 'hsl('+Math.random()*360+',100%,50%)'
        });
    }
}

function updHUD() {
    document.getElementById('sc').innerText = stats.sc;
    document.getElementById('lv').innerText = '❤️'.repeat(stats.lv);
    const t = document.getElementById('tm');
    t.innerText = timeLeft;
    t.className = timeLeft <= 5 ? 'timer-warn' : '';
}

// INPUTS
const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;
window.onmousemove = e => paddle.x = e.clientX - paddle.w/2;
window.onclick = () => { if(state==='PLAY' && !ball.mov) { ball.mov=true; ball.dy=-CFG.speed; ball.dx=2; } };

function loop() {
    update(); draw(); requestAnimationFrame(loop);
}
