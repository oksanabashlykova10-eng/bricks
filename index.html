<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Grammar Bricks Editor Ultimate</title>
<style>
    :root {
        --neon-main: #00f3ff;
        --bg-dark: #0a0a10;
        --panel-bg: #14141a;
        --text-main: #e0e0e0;
    }
    body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }
    
    /* СТИЛИ РЕДАКТОРА */
    .sidebar { width: 420px; background: var(--panel-bg); border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 10; box-shadow: 5px 0 20px #000; }
    .logo-area { padding: 15px; background: #000; border-bottom: 2px solid var(--neon-main); display: flex; align-items: center; gap: 10px; }
    .logo-area img { height: 40px; filter: drop-shadow(0 0 5px var(--neon-main)); }
    .logo-area span { font-weight: 800; color: #fff; text-shadow: 0 0 10px var(--neon-main); letter-spacing: 1px; }
    
    .tabs { display: flex; background: #000; }
    .tab-btn { flex: 1; background: transparent; border: none; color: #666; padding: 12px 0; cursor: pointer; font-weight: bold; border-bottom: 2px solid transparent; transition: 0.3s; }
    .tab-btn.active { color: var(--neon-main); border-bottom-color: var(--neon-main); text-shadow: 0 0 8px var(--neon-main); background: #111; }
    
    .scroll-content { flex: 1; overflow-y: auto; padding: 15px; }
    .section { background: rgba(255,255,255,0.03); border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 15px; }
    .section-title { color: var(--neon-main); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
    input, select, textarea { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
    textarea { resize: vertical; min-height: 60px; }
    input:focus, select:focus, textarea:focus { border-color: var(--neon-main); outline: none; box-shadow: 0 0 8px rgba(0,243,255,0.2); }
    input[type="color"] { height: 30px; padding: 0; cursor: pointer; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .action-bar { padding: 15px; background: #050505; border-top: 1px solid #333; }
    .generate-btn { width: 100%; background: linear-gradient(90deg, #00f3ff, #0066ff); color: #000; font-weight: 900; border: none; padding: 15px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; border-radius: 4px; }
    .generate-btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--neon-main); }
    
    .preview-area { flex: 1; background: #000; position: relative; display: flex; flex-direction: column; }
    iframe { width: 100%; height: 100%; border: none; }
    
    .copyright { font-size: 9px; color: #555; text-align: center; margin-top: 5px; }
</style>
</head>
<body>

<div class="sidebar">
    <div class="logo-area">
        <img src="https://img.genially.com/67961b32a116fb001568a75e/673752a5-8d4d-40d1-9b5f-f04ebd91a27c.png">
        <span>GRAMMAR BRICKS</span>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('visual')">ВИЗУАЛ</button>
        <button class="tab-btn" onclick="setTab('game')">ИГРА</button>
        <button class="tab-btn" onclick="setTab('tasks')">ЗАДАНИЯ</button>
        <button class="tab-btn" onclick="setTab('audio')">ЗВУК</button>
    </div>

    <div id="tab-visual" class="scroll-content">
        <div class="section">
            <div class="section-title">Главный экран</div>
            <div class="form-group"><label>Заголовок игры</label><input type="text" id="inp-title" value="Grammar Bricks"></div>
            <div class="grid-2">
                <div class="form-group"><label>Шрифт</label><select id="inp-fontTitle"><option value="'Courier New'">Courier</option><option value="Arial">Arial</option><option value="'Comic Sans MS'">Comic Sans</option><option value="Verdana">Verdana</option></select></div>
                <div class="form-group"><label>Размер</label><input type="number" id="inp-sizeTitle" value="32"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Цвет текста</label><input type="color" id="inp-colTitle" value="#ffffff"></div>
                <div class="form-group"><label>Цвет неона</label><input type="color" id="inp-neonTitle" value="#00ffff"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Фон игры</div>
            <div class="form-group"><label>Тип</label>
                <select id="inp-bgType" onchange="toggleBg()">
                    <option value="transparent">Прозрачный (для Genially)</option>
                    <option value="color">Цвет</option>
                    <option value="image">Своя картинка</option>
                </select>
            </div>
            <div id="bg-color-grp" class="form-group" style="display:none"><label>Цвет</label><input type="color" id="inp-bgColor" value="#111111"></div>
            <div id="bg-img-grp" class="form-group" style="display:none"><label>Файл</label><input type="file" onchange="loadFile(this, 'bg')"></div>
        </div>
        
        <div class="section">
            <div class="section-title">Финал</div>
            <div class="form-group"><label>Победа (Текст)</label><input type="text" id="inp-winTxt" value="YOU WIN!"></div>
            <div class="form-group"><label>Салют</label>
                <select id="inp-winEff">
                    <option value="firework">Фейерверк</option>
                    <option value="bubbles">Пузырьки</option>
                    <option value="flowers">Цветочки</option>
                    <option value="stars">Звездочки</option>
                </select>
            </div>
        </div>
    </div>

    <div id="tab-game" class="scroll-content" style="display:none">
        <div class="section">
            <div class="grid-2">
                <div class="form-group"><label>Жизни</label><input type="number" id="inp-lives" value="3"></div>
                <div class="form-group"><label>Таймер (сек)</label><input type="number" id="inp-time" value="90"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Скорость шара</label><input type="range" id="inp-speed" min="3" max="10" value="5"></div>
                <div class="form-group"><label>Цвет шара</label><input type="color" id="inp-ballCol" value="#ffffff"></div>
            </div>
        </div>
    </div>

    <div id="tab-tasks" class="scroll-content" style="display:none">
        <div class="section" style="border-left: 3px solid #0f0;">
            <div class="section-title" style="color:#0f0">EASY TASKS (Зеленые)</div>
            <div class="form-group">
                <label>Вопросы (один на строку)</label>
                <textarea id="easyQ">She ___ to school.&#10;Opposite of 'Happy'?</textarea>
            </div>
            <div class="form-group">
                <label>Ответы (Верный|Неверный|Неверный)</label>
                <textarea id="easyA">goes|go|going&#10;Sad|Glad|Joy</textarea>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Цвет текста</label><input type="color" id="inp-ezCol" value="#ffffff"></div>
                <div class="form-group"><label>Неон</label><input type="color" id="inp-ezNeon" value="#00ff00"></div>
            </div>
        </div>

        <div class="section" style="border-left: 3px solid #ff0;">
            <div class="section-title" style="color:#ff0">HARD TASKS (Желтые)</div>
            <div class="form-group">
                <label>Вопросы (один на строку)</label>
                <textarea id="hardQ">If I were you, I ___ go.</textarea>
            </div>
            <div class="form-group">
                <label>Ответы (Верный|Неверный|Неверный)</label>
                <textarea id="hardA">would|will|had</textarea>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Цвет текста</label><input type="color" id="inp-hdCol" value="#ffffff"></div>
                <div class="form-group"><label>Неон</label><input type="color" id="inp-hdNeon" value="#ffff00"></div>
            </div>
        </div>
    </div>

    <div id="tab-audio" class="scroll-content" style="display:none">
        <div class="section">
            <div class="form-group"><label>Фоновая музыка</label><input type="file" onchange="loadFile(this, 'bgm')"></div>
            <div class="form-group"><label>Правильный ответ</label><input type="file" onchange="loadFile(this, 'cor')"></div>
            <div class="form-group"><label>Ошибка</label><input type="file" onchange="loadFile(this, 'err')"></div>
            <div class="form-group"><label>Победа</label><input type="file" onchange="loadFile(this, 'win')"></div>
            <div class="form-group"><label>Провал</label><input type="file" onchange="loadFile(this, 'lose')"></div>
        </div>
    </div>

    <div class="action-bar">
        <button class="generate-btn" onclick="generate()">СКОПИРОВАТЬ КОД</button>
        <div class="copyright">© Все права принадлежат Башлыковой Оксане Михайловне</div>
    </div>
</div>

<div class="preview-area">
    <iframe id="previewFrame"></iframe>
</div>

<script type="text/template" id="game-template">
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: {{TITLE_FONT}}, monospace; user-select: none; }
    #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    
    .bg-layer { position: absolute; top:0; left:0; width:100%; height:100%; z-index:-1; {{BG_STYLE}} }

    /* ANIMATIONS */
    .shake { animation: s 0.4s both; }
    .shake-s { animation: ss 0.2s both; }
    @keyframes s { 10%,90%{transform:translate3d(-5px,0,0)} 20%,80%{transform:translate3d(5px,0,0)} 30%,50%,70%{transform:translate3d(-10px,0,0)} 40%,60%{transform:translate3d(10px,0,0)} }
    @keyframes ss { 0%{transform:translate(0,0)} 25%{transform:translate(2px,2px)} 50%{transform:translate(-2px,-2px)} 75%{transform:translate(2px,-2px)} 100%{transform:translate(0,0)} }

    canvas { display: block; width: 100%; height: 100%; border-radius: 12px; border: 2px solid rgba(0, 255, 255, 0.1); }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 20; transition: opacity 0.3s; }
    .overlay.win-mode { background: rgba(0, 0, 0, 0.3) !important; backdrop-filter: none !important; }
    .hidden { opacity: 0; pointer-events: none; z-index: -1 !important; }

    .neon-panel {
        background: rgba(10, 10, 15, 0.96);
        border: 2px solid {{NEON_TITLE}}; 
        box-shadow: 0 0 25px {{NEON_TITLE}}, inset 0 0 20px rgba(0,0,0,0.5);
        padding: 30px; border-radius: 20px; color: #fff; text-align: center; max-width: 600px; width: 90%;
        display: flex; flex-direction: column; align-items: center;
    }
    h1 { margin: 0 0 15px 0; font-family: {{TITLE_FONT}}; font-size: {{TITLE_SIZE}}px; color: {{TITLE_COL}}; text-shadow: 0 0 15px {{NEON_TITLE}}; letter-spacing: 2px; }
    
    .btn {
        background: transparent !important; border: 3px solid {{NEON_TITLE}} !important; color: {{NEON_TITLE}} !important;
        padding: 15px 40px !important; font-size: 22px !important; margin-top: 20px !important; cursor: pointer !important;
        text-transform: uppercase !important; font-weight: 800 !important; border-radius: 50px !important;
        box-shadow: 0 0 15px {{NEON_TITLE}}; transition: 0.3s;
    }
    .btn:hover { background: {{NEON_TITLE}} !important; color: #000 !important; transform: scale(1.05); }

    #hud { position: absolute; top: 10px; left: 0; width: 100%; display: flex; justify-content: center; gap: 15px; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 0 0 5px #000; z-index: 10; pointer-events: none; }
    .timer-warn { color: #f00; animation: ss 0.5s infinite; }

    /* QUESTIONS */
    .q-box { padding: 30px !important; min-height: 250px; }
    .q-txt { font-weight: bold; font-size: 20px; margin-bottom: 20px; line-height: 1.4; }
    
    /* Green Theme */
    .theme-easy { border-color: {{EZ_NEON}} !important; box-shadow: 0 0 30px {{EZ_NEON}} !important; }
    .theme-easy .q-txt { color: {{EZ_COL}}; text-shadow: 0 0 10px {{EZ_NEON}}; }
    .theme-easy .ans-btn:hover { border-color: {{EZ_NEON}}; box-shadow: 0 0 15px {{EZ_NEON}}; }
    
    /* Yellow Theme */
    .theme-hard { border-color: {{HD_NEON}} !important; box-shadow: 0 0 30px {{HD_NEON}} !important; }
    .theme-hard .q-txt { color: {{HD_COL}}; text-shadow: 0 0 10px {{HD_NEON}}; }
    .theme-hard .ans-btn:hover { border-color: {{HD_NEON}}; box-shadow: 0 0 15px {{HD_NEON}}; }

    .ans-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .ans-btn {
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
        padding: 12px 20px; cursor: pointer; border-radius: 8px; text-align: left; font-size: 16px;
    }

    #music-btn { position: absolute; top: 15px; right: 15px; width: 35px; height: 35px; border: 2px solid {{NEON_TITLE}}; border-radius: 50%; color: {{NEON_TITLE}}; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 30; background: rgba(0,0,0,0.5); }
    #music-btn.off { border-color: #555; color: #555; }
</style>
</head>
<body>
<div id="game-container">
    <div class="bg-layer"></div>
    <canvas id="gc"></canvas>
    <div id="music-btn" class="off">🎵</div>
    <div id="hud" class="hidden">
        <span>Score: <b id="sc">0</b></span>
        <span>Lives: <b id="lv"></b></span>
        <span>Time: <b id="tm"></b></span>
        <span>🪙 <b id="tr">0</b></span>
    </div>

    <div id="start-screen" class="overlay">
        <div class="neon-panel">
            <h1>{{TITLE_TXT}}</h1>
            <p>🟩 Easy Questions<br>🟨 Hard Questions</p>
            <button class="btn" onclick="startGame()">PLAY</button>
        </div>
    </div>

    <div id="q-modal" class="overlay hidden">
        <div id="q-panel" class="neon-panel q-box">
            <div id="q-text" class="q-txt">...</div>
            <div id="q-list" class="ans-grid"></div>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <div class="neon-panel">
            <h1 id="end-title">GAME OVER</h1>
            <p>Score: <span id="end-score">0</span></p>
            <button class="btn" onclick="startGame()">RESTART</button>
        </div>
    </div>
</div>

<script>
    // DATA INJECTION
    const TASKS = {{TASKS_JSON}};
    const CFG = {
        rows: {{ROWS}}, 
        cols: 7, 
        lives: {{LIVES}}, 
        speed: {{SPEED}}, 
        time: {{TIME}},
        ballCol: '{{BALL_COL}}',
        winTxt: '{{WIN_TXT}}',
        loseTxt: 'GAME OVER',
        winEff: '{{WIN_EFF}}',
        colors: { green: '{{EZ_NEON}}', yellow: '{{HD_NEON}}', bonus: '#00BFFF', norm: ['#FF69B4', '#BA55D3', '#FFA500', '#20B2AA'] }
    };
    const SND = {
        bgm: {{SND_BGM}}, cor: {{SND_COR}}, err: {{SND_ERR}}, win: {{SND_WIN}}, lose: {{SND_LOSE}}
    };

    // LOGIC
    const cvs = document.getElementById('gc'); const ctx = cvs.getContext('2d');
    let state='START', anim, timerId, acx;
    let stats={sc:0, lv:CFG.lives, tr:0}, timeLeft=CFG.time;
    let paddle={x:0, y:0, w:100, h:12}, balls=[], bricks=[], drops=[], parts=[];
    let curQ=null, curRow=-1, W, H, musOn=false, musObj=null;

    function initAudio() { if(!acx) acx = new (window.AudioContext||window.webkitAudioContext)(); if(acx.state==='suspended') acx.resume(); }
    
    document.getElementById('music-btn').onclick = function() {
        musOn = !musOn; initAudio();
        this.className = musOn ? '' : 'off';
        if(musOn && SND.bgm) { if(!musObj) { musObj=new Audio(SND.bgm); musObj.loop=true; } musObj.play(); }
        else if(musObj) musObj.pause();
    };

    function playSnd(type) {
        if(SND[type]) { new Audio(SND[type]).play(); return; }
        if(!acx) return;
        const t=acx.currentTime; const o=acx.createOscillator(); const g=acx.createGain();
        o.connect(g); g.connect(acx.destination);
        if(type==='tick') { o.type='triangle'; o.frequency.setValueAtTime(800,t); g.gain.setValueAtTime(0.05,t); o.start(t); o.stop(t+0.1); }
        else if(type==='cor') { o.frequency.setValueAtTime(600,t); o.frequency.linearRampToValueAtTime(1200,t+0.1); g.gain.value=0.1; o.start(t); o.stop(t+0.2); }
        else if(type==='err') { o.type='sawtooth'; o.frequency.setValueAtTime(150,t); o.frequency.linearRampToValueAtTime(100,t+0.3); g.gain.value=0.1; o.start(t); o.stop(t+0.3); }
        else if(type==='bounce') { o.frequency.setValueAtTime(400,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.1); o.start(t); o.stop(t+0.1); }
    }

    function resize() {
        const c = document.getElementById('game-container');
        W = c.clientWidth; H = c.clientHeight;
        cvs.width = W; cvs.height = H;
        paddle.y = H - 40; paddle.w = Math.min(200, W*0.25);
    }

    function initBricks() {
        bricks=[]; 
        const ezPool = TASKS.filter(t=>t.lvl==='easy');
        const hdPool = TASKS.filter(t=>t.lvl==='hard');
        
        // Strategy: Fill rows with questions until pool empty
        let grid = [];
        for(let r=0; r<CFG.rows; r++) {
            let row = [];
            for(let c=0; c<CFG.cols; c++) {
                let type = 'norm';
                // Logic to inject questions
                if(Math.random() < 0.3) {
                    if(ezPool.length > 0 && Math.random() > 0.5) { type='green'; ezPool.pop(); }
                    else if(hdPool.length > 0) { type='yellow'; hdPool.pop(); }
                }
                // If pool empty but type assigned, fallback to norm
                if((type==='green' && ezPool.length<0) || (type==='yellow' && hdPool.length<0)) type='norm';
                
                let color = type==='norm' ? CFG.colors.norm[Math.floor(Math.random()*4)] : CFG.colors[type];
                row.push({x:0, y:0, w:0, h:0, t:type, c:color, a:true});
            }
            bricks.push(row);
        }
        
        // Layout calculation
        const bw = W/CFG.cols; const bh = H*0.035;
        bricks.forEach((row, r) => {
            row.forEach((b, c) => {
                b.w=bw-2; b.h=bh; b.x=c*bw+1; b.y=r*(bh+5)+60;
            });
        });
    }

    function update() {
        if(state!=='PLAY') return;
        balls.forEach(b => {
            if(b.mov) {
                b.x+=b.dx; b.y+=b.dy;
                if(b.x<b.r || b.x>W-b.r) { b.dx*=-1; playSnd('bounce'); }
                if(b.y<b.r) { b.dy*=-1; playSnd('bounce'); }
                if(b.y>H) b.dead=true;
                
                // Paddle
                if(b.y+b.r > paddle.y && b.x>paddle.x && b.x<paddle.x+paddle.w) {
                    b.dy = -Math.abs(b.dy);
                    b.dx = ((b.x-(paddle.x+paddle.w/2))/(paddle.w/2))*6;
                    playSnd('bounce');
                }
                
                // Brick
                bricks.forEach((row, ri) => row.forEach(bk => {
                    if(bk.a && b.x>bk.x && b.x<bk.x+bk.w && b.y>bk.y && b.y<bk.y+bk.h) {
                        b.dy*=-1; 
                        if(bk.t==='norm') { bk.a=false; stats.sc+=10; playSnd('bounce'); }
                        else { 
                            state='Q'; curQ=null; curRow=ri; 
                            showQ(bk.t);
                        }
                    }
                }));
            } else { b.x=paddle.x+paddle.w/2; b.y=paddle.y-10; }
        });
        balls = balls.filter(b=>!b.dead);
        if(balls.length===0 && state==='PLAY') {
            stats.lv--; playSnd('err');
            if(stats.lv<=0) end(false); else { balls.push({x:0,y:0,r:6,dx:0,dy:0,mov:false}); }
        }
        // Win condition check
        const qLeft = bricks.some(r=>r.some(b=>b.a && (b.t==='green'||b.t==='yellow')));
        if(!qLeft) end(true);
        updHUD();
    }

    function draw() {
        ctx.clearRect(0,0,W,H);
        // Particles
        parts.forEach((p,i) => {
            p.x+=p.dx; p.y+=p.dy; p.l-=0.02;
            ctx.globalAlpha=p.l; 
            if(CFG.winEff==='stars') ctx.fillText('⭐',p.x,p.y);
            else if(CFG.winEff==='flowers') ctx.fillText('🌸',p.x,p.y);
            else { ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); }
            if(p.l<=0) parts.splice(i,1);
        });
        ctx.globalAlpha=1;

        // Paddle
        ctx.fillStyle='#fff'; ctx.shadowBlur=10; ctx.shadowColor='#0ff';
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h); ctx.shadowBlur=0;

        // Bricks
        bricks.forEach(r => r.forEach(b => {
            if(!b.a) return;
            ctx.fillStyle = b.t==='norm' ? 'rgba(255,255,255,0.1)' : b.c;
            ctx.strokeStyle = b.c; ctx.lineWidth=2;
            ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeRect(b.x,b.y,b.w,b.h);
            if(b.t!=='norm') { ctx.fillStyle='#000'; ctx.font='bold 16px Arial'; ctx.fillText('?', b.x+b.w/2-4, b.y+b.h/2+5); }
        }));

        // Ball
        ctx.fillStyle=CFG.ballCol;
        balls.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); });
    }

    function showQ(type) {
        const pool = TASKS.filter(t => t.lvl === (type==='green'?'easy':'hard'));
        const q = pool.length ? pool[Math.floor(Math.random()*pool.length)] : TASKS[0];
        curQ = q;
        
        const modal = document.getElementById('q-modal');
        const pnl = document.getElementById('q-panel');
        modal.classList.remove('hidden');
        pnl.className = 'neon-panel q-box ' + (type==='green'?'theme-easy':'theme-hard');
        
        document.getElementById('q-text').innerText = q.q;
        const lst = document.getElementById('q-list'); lst.innerHTML='';
        
        q.opts.forEach((ans, i) => {
            const btn = document.createElement('div');
            btn.className = 'ans-btn';
            btn.innerHTML = ans;
            btn.onclick = () => ansQ(i);
            lst.appendChild(btn);
        });
    }

    function ansQ(idx) {
        document.getElementById('q-modal').classList.add('hidden');
        if(idx === curQ.cor) {
            playSnd('cor'); stats.sc+=100;
            bricks[curRow].forEach(b => b.a = false); // Clear row
        } else {
            playSnd('err'); stats.lv--; 
            bricks[curRow].forEach(b => { if(b.t!=='norm') { b.t='norm'; b.c='#666'; } });
        }
        if(stats.lv<=0) end(false); else state='PLAY';
    }

    function end(win) {
        state = win?'WIN':'END'; clearInterval(timerId);
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        const t = document.getElementById('end-title');
        t.innerText = win ? CFG.winTxt : CFG.loseTxt;
        t.style.color = win ? '#0f0' : '#f00';
        document.getElementById('end-score').innerText = stats.sc;
        playSnd(win?'win':'lose');
        if(win) setInterval(() => {
            for(let i=0; i<10; i++) parts.push({
                x:Math.random()*W, y:Math.random()*H, dx:(Math.random()-0.5)*5, dy:(Math.random()-0.5)*5,
                l:1, s:Math.random()*5+2, c:'hsl('+Math.random()*360+',100%,50%)'
            });
        }, 300);
    }

    function updHUD() {
        document.getElementById('sc').innerText = stats.sc;
        document.getElementById('lv').innerText = '❤️'.repeat(stats.lv);
        const tm = document.getElementById('tm');
        tm.innerText = timeLeft;
        tm.className = timeLeft<=10 ? 'timer-warn' : '';
    }

    window.onmousemove = e => paddle.x = e.clientX - 60;
    window.onclick = () => { if(state==='PLAY' && !balls[0].mov) { balls[0].mov=true; balls[0].dy=-CFG.speed; balls[0].dx=2; } };
    function loop() { requestAnimationFrame(loop); update(); draw(); }
    
    function startGame() {
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resize();
        state='PLAY'; stats.sc=0; stats.lv=CFG.lives; timeLeft=CFG.time;
        balls=[{x:0,y:0,r:6,dx:0,dy:0,mov:false}];
        parts=[];
        initBricks(); updHUD();
        clearInterval(timerId);
        timerId = setInterval(() => {
            if(state==='PLAY') {
                timeLeft--; 
                if(timeLeft<=5) playSnd('tick');
                if(timeLeft<=0) end(false);
                updHUD();
            }
        }, 1000);
        loop();
    }
    window.startGame = startGame;
</script>
</body>
</html>
</script>

<script>
    // --- JS РЕДАКТОРА ---
    const files = {};

    function setTab(id) {
        document.querySelectorAll('.scroll-content').forEach(el => el.style.display = 'none');
        document.getElementById('tab-' + id).style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }

    function toggleBg() {
        const t = document.getElementById('inp-bgType').value;
        document.getElementById('bg-color-grp').style.display = t==='color'?'block':'none';
        document.getElementById('bg-img-grp').style.display = t==='image'?'block':'none';
    }

    function loadFile(inp, key) {
        if(inp.files[0]) {
            const r = new FileReader();
            r.onload = e => { files[key] = e.target.result; generate(); };
            r.readAsDataURL(inp.files[0]);
        }
    }

    function parseTasks(qId, aId, lvl) {
        const qs = document.getElementById(qId).value.split('\n').filter(s=>s.trim());
        const as = document.getElementById(aId).value.split('\n').filter(s=>s.trim());
        return qs.map((q, i) => {
            if(!as[i]) return null;
            const parts = as[i].split('|');
            const correctTxt = parts[0];
            const shuffled = [...parts].sort(()=>Math.random()-0.5);
            return {
                q: q,
                opts: shuffled,
                cor: shuffled.indexOf(correctTxt),
                lvl: lvl
            };
        }).filter(x=>x);
    }

    function generate() {
        const ez = parseTasks('easyQ', 'easyA', 'easy');
        const hd = parseTasks('hardQ', 'hardA', 'hard');
        const allTasks = [...ez, ...hd];
        
        let rows = 12;
        if(allTasks.length > 10) rows = Math.min(18, 12 + (allTasks.length - 10));

        let tpl = document.getElementById('game-template').innerHTML;
        
        // Helper to replace text
        const rep = (k, v) => tpl = tpl.replace(new RegExp('{{'+k+'}}', 'g'), v);
        
        rep('TITLE_TXT', document.getElementById('inp-title').value);
        rep('TITLE_FONT', document.getElementById('inp-fontTitle').value);
        rep('TITLE_SIZE', document.getElementById('inp-sizeTitle').value);
        rep('TITLE_COL', document.getElementById('inp-colTitle').value);
        rep('NEON_TITLE', document.getElementById('inp-neonTitle').value);
        
        // BG
        const bgT = document.getElementById('inp-bgType').value;
        let bgStyle = '';
        if(bgT === 'color') bgStyle = `background: ${document.getElementById('inp-bgColor').value};`;
        else if(bgT === 'image' && files.bg) bgStyle = `background: url('${files.bg}') center/cover;`;
        rep('BG_STYLE', bgStyle);

        // Game Settings
        rep('LIVES', document.getElementById('inp-lives').value);
        rep('TIME', document.getElementById('inp-time').value);
        rep('SPEED', document.getElementById('inp-speed').value);
        rep('BALL_COL', document.getElementById('inp-ballCol').value);
        rep('ROWS', rows);
        
        // Tasks Visuals
        rep('EZ_COL', document.getElementById('inp-ezCol').value);
        rep('EZ_NEON', document.getElementById('inp-ezNeon').value);
        rep('HD_COL', document.getElementById('inp-hdCol').value);
        rep('HD_NEON', document.getElementById('inp-hdNeon').value);

        // Win
        rep('WIN_TXT', document.getElementById('inp-winTxt').value);
        rep('WIN_EFF', document.getElementById('inp-winEff').value);

        // Data & Sounds
        rep('TASKS_JSON', JSON.stringify(allTasks));
        rep('SND_BGM', files.bgm ? `'${files.bgm}'` : 'null');
        rep('SND_COR', files.cor ? `'${files.cor}'` : 'null');
        rep('SND_ERR', files.err ? `'${files.err}'` : 'null');
        rep('SND_WIN', files.win ? `'${files.win}'` : 'null');
        rep('SND_LOSE', files.lose ? `'${files.lose}'` : 'null');

        // Render
        const finalHTML = tpl.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
        document.getElementById('previewFrame').srcdoc = finalHTML;
        
        // Copy logic (if clicked by user)
        if(event && event.type==='click' && event.target.className.includes('generate-btn')) {
            const copyStr = `<iframe srcdoc="${finalHTML.replace(/"/g, '&quot;')}" width="100%" height="100%" frameborder="0"></iframe>`;
            navigator.clipboard.writeText(copyStr).then(()=>alert('Код скопирован!'));
        }
    }

    // Init
    generate();
</script>
</body>
</html>
