<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Grammar Bricks: Editor</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Логотип канала */
        #logo-container {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 100;
        }
        #logo-img {
            width: 60px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 15px #00BFFF; /* Голубой неон */
            border: 2px solid #00BFFF;
        }

        h1 { text-shadow: 0 0 20px #0f0; margin-bottom: 30px; text-align: center; }

        .container {
            width: 90%; max-width: 1000px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        
        .panel {
            background: rgba(20, 20, 25, 0.9);
            border: 2px solid #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            padding: 20px; border-radius: 15px;
            margin-bottom: 20px;
        }

        .full-width { grid-column: 1 / -1; }

        h2 { border-bottom: 1px solid #555; padding-bottom: 10px; color: #0ff; margin-top: 0; }
        
        label { display: block; margin-top: 15px; color: #ddd; font-weight: bold; }
        .hint { font-size: 12px; color: #888; margin-bottom: 5px; display: block; }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px;
            background: #000; border: 1px solid #444; color: #0f0;
            font-family: inherit; margin-top: 5px;
            box-sizing: border-box;
        }
        input[type="color"] { width: 100%; height: 40px; border: none; background: none; }
        input[type="file"] { margin-top: 5px; color: #aaa; }

        /* Уровни */
        .level-box {
            border: 1px solid #444; background: #111;
            padding: 15px; margin-bottom: 15px; position: relative;
        }
        .level-title { font-weight: bold; color: #ff0; margin-bottom: 10px; }
        .remove-level {
            position: absolute; top: 5px; right: 5px;
            background: #f00; color: #fff; border: none; cursor: pointer; padding: 2px 8px;
        }

        .task-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        textarea { height: 100px; resize: vertical; font-size: 12px; }

        /* Кнопки */
        .btn {
            background: #000; border: 2px solid #0f0; color: #0f0;
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
            box-shadow: 0 0 10px #0f0; width: 100%; margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background: #0f0; color: #000; box-shadow: 0 0 25px #0f0; }
        .btn-blue { border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff; }
        .btn-blue:hover { background: #0ff; color: #000; box-shadow: 0 0 25px #0ff; }

        /* Футер */
        footer {
            margin-top: 50px; margin-bottom: 20px;
            color: #555; font-size: 12px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="logo-container">
        <a href="https://t.me/ok_bash" target="_blank">
            <img src="https://img.genially.com/67961b32a116fb001568a75e/673752a5-8d4d-40d1-9b5f-f04ebd91a27c.png" id="logo-img" alt="Logo">
        </a>
    </div>

    <h1>⚡ Grammar Bricks BUILDER ⚡</h1>

    <div class="container">
        
        <div class="panel">
            <h2>1. Визуал (Start & Game)</h2>
            
            <label>Название игры (Заголовок):</label>
            <input type="text" id="gameTitle" value="Grammar Bricks">

            <label>Шрифт (название из Google Fonts или системный):</label>
            <input type="text" id="fontFamily" value="'Courier New', monospace">

            <label>Размер шрифта заголовка (px):</label>
            <input type="number" id="titleSize" value="32">

            <label>Основной цвет неона (Start Screen):</label>
            <input type="color" id="mainNeonColor" value="#00FFFF">

            <label>Фон игры (Цвет):</label>
            <div class="hint">Выберите "Прозрачный" или загрузите картинку ниже.</div>
            <select id="bgType">
                <option value="transparent">Полностью прозрачный</option>
                <option value="color">Цветной</option>
            </select>
            <input type="color" id="bgColor" value="#000000" style="display:none;">

            <label>Свой фон (Картинка):</label>
            <input type="file" id="bgImageFile" accept="image/*">
        </div>

        <div class="panel">
            <h2>2. Геймплей и Вопросы</h2>
            
            <label>Жизни (Сердечки):</label>
            <input type="number" id="lives" value="3">

            <label>Время на уровень (сек):</label>
            <input type="number" id="timeLimit" value="90">

            <label>Скорость шарика (1-10):</label>
            <input type="number" id="ballSpeed" value="5">
            
            <label>Цвет шарика:</label>
            <input type="color" id="ballColor" value="#FFFFFF">

            <label>Стиль рамочки вопроса (Неон):</label>
            <input type="color" id="qFrameColor" value="#FFFF00">
            
            <label>Размер текста вопроса (px):</label>
            <input type="number" id="qTextSize" value="22">

            <label>Финал: Текст победы</label>
            <input type="text" id="winText" value="YOU WIN!">
            
            <label>Финал: Текст проигрыша</label>
            <input type="text" id="loseText" value="GAME OVER">
        </div>

        <div class="panel full-width">
            <h2>3. Эффекты и Звуки</h2>
            <div class="task-grid">
                <div>
                    <label>Эффект победы:</label>
                    <select id="winEffect">
                        <option value="fireworks">Салют (Фейерверк)</option>
                        <option value="bubbles">Пузырьки</option>
                        <option value="flowers">Цветочки</option>
                        <option value="stars">Звездочки</option>
                    </select>
                </div>
                <div>
                    <label>Фоновая музыка (mp3):</label>
                    <input type="file" id="bgMusicFile" accept="audio/*">
                </div>
                <div>
                    <label>Звук: Правильный ответ</label>
                    <input type="file" id="sfxCorrect" accept="audio/*">
                </div>
                <div>
                    <label>Звук: Ошибка</label>
                    <input type="file" id="sfxWrong" accept="audio/*">
                </div>
                <div>
                    <label>Звук: Победа (Win)</label>
                    <input type="file" id="sfxWin" accept="audio/*">
                </div>
                <div>
                    <label>Звук: Провал (Lose)</label>
                    <input type="file" id="sfxLose" accept="audio/*">
                </div>
            </div>
            <div class="hint">Если файлы не выбраны, используются стандартные звуки из Версии 8.</div>
        </div>

        <div class="panel full-width">
            <h2>4. Редактор Уровней</h2>
            <div id="levels-container"></div>
            <button class="btn btn-blue" onclick="addLevel()">+ Добавить Уровень</button>
        </div>

        <div class="full-width" style="text-align: center;">
            <button class="btn" onclick="generateGame()" style="font-size: 24px; padding: 20px;">💾 СКАЧАТЬ ИГРУ (.html)</button>
        </div>

    </div>

    <footer>
        &copy; Все права принадлежат Башлыковой Оксане Михайловне
    </footer>

    <script>
        // Управление UI
        document.getElementById('bgType').addEventListener('change', function() {
            document.getElementById('bgColor').style.display = this.value === 'color' ? 'block' : 'none';
        });

        let levelCount = 0;

        function addLevel() {
            levelCount++;
            const div = document.createElement('div');
            div.className = 'level-box';
            div.innerHTML = `
                <div class="level-title">Уровень ${levelCount}</div>
                <button class="remove-level" onclick="this.parentElement.remove()">X</button>
                
                <div style="margin-bottom: 15px; border-bottom: 1px dashed #333; padding-bottom: 10px;">
                    <label style="color:#0f0">🟩 Легкие задания (Зеленые кирпичи)</label>
                    <div class="task-grid">
                        <div>
                            <span class="hint">Вопросы (каждый с новой строки):</span>
                            <textarea class="easy-q" placeholder="She ___ to school.\nI ___ an apple."></textarea>
                        </div>
                        <div>
                            <span class="hint">Ответы (Правильный|Неверный|Неверный):</span>
                            <textarea class="easy-a" placeholder="goes|go|going\nate|eat|eaten"></textarea>
                        </div>
                    </div>
                </div>

                <div>
                    <label style="color:#ff0">🟨 Сложные задания (Желтые кирпичи)</label>
                    <div class="task-grid">
                        <div>
                            <span class="hint">Вопросы (каждый с новой строки):</span>
                            <textarea class="hard-q" placeholder="If I were you..."></textarea>
                        </div>
                        <div>
                            <span class="hint">Ответы (Правильный|Неверный|Неверный):</span>
                            <textarea class="hard-a" placeholder="would|will|had"></textarea>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('levels-container').appendChild(div);
        }

        // Добавляем один уровень при старте
        addLevel();

        // Конвертация файла в Base64
        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // --- ГЕНЕРАТОР ---
        async function generateGame() {
            const btn = document.querySelector('button[onclick="generateGame()"]');
            btn.innerText = "⏳ ГЕНЕРАЦИЯ...";
            btn.disabled = true;

            try {
                // 1. Сбор данных уровней
                const levelsData = [];
                document.querySelectorAll('.level-box').forEach(box => {
                    const parseTasks = (qClass, aClass, difficulty) => {
                        const qText = box.querySelector(qClass).value.trim();
                        const aText = box.querySelector(aClass).value.trim();
                        if(!qText) return [];
                        
                        const qs = qText.split('\n');
                        const as = aText.split('\n');
                        
                        return qs.map((q, i) => {
                            if(!q.trim()) return null;
                            const answerLine = as[i] || "Yes|No"; // Фолбек
                            const parts = answerLine.split('|');
                            return {
                                q: q.trim(),
                                a: parts, // Массив ответов (первый правильный)
                                level: difficulty
                            };
                        }).filter(x => x !== null);
                    };

                    const easy = parseTasks('.easy-q', '.easy-a', 'easy');
                    const hard = parseTasks('.hard-q', '.hard-a', 'hard');
                    
                    if(easy.length > 0 || hard.length > 0) {
                        levelsData.push([...easy, ...hard]);
                    }
                });

                if(levelsData.length === 0) {
                    alert("Добавьте хотя бы один вопрос в уровне!");
                    btn.innerText = "💾 СКАЧАТЬ ИГРУ"; btn.disabled = false;
                    return;
                }

                // 2. Сбор файлов (Base64)
                const files = {};
                const fileInputs = ['bgImageFile', 'bgMusicFile', 'sfxCorrect', 'sfxWrong', 'sfxWin', 'sfxLose'];
                
                for (const id of fileInputs) {
                    const el = document.getElementById(id);
                    if (el.files.length > 0) {
                        files[id] = await fileToBase64(el.files[0]);
                    } else {
                        files[id] = null;
                    }
                }

                // 3. Формирование конфига
                const CONFIG = {
                    title: document.getElementById('gameTitle').value,
                    font: document.getElementById('fontFamily').value,
                    titleSize: document.getElementById('titleSize').value + 'px',
                    neonColor: document.getElementById('mainNeonColor').value,
                    bgType: document.getElementById('bgType').value,
                    bgColor: document.getElementById('bgColor').value,
                    bgImage: files['bgImageFile'],
                    
                    lives: parseInt(document.getElementById('lives').value),
                    time: parseInt(document.getElementById('timeLimit').value),
                    ballSpeed: parseInt(document.getElementById('ballSpeed').value),
                    ballColor: document.getElementById('ballColor').value,
                    
                    qFrameColor: document.getElementById('qFrameColor').value,
                    qTextSize: document.getElementById('qTextSize').value + 'px',
                    
                    winText: document.getElementById('winText').value,
                    loseText: document.getElementById('loseText').value,
                    
                    winEffect: document.getElementById('winEffect').value, // fireworks, bubbles, etc.
                    
                    levels: levelsData, // Массив массивов вопросов
                    
                    audio: {
                        music: files['bgMusicFile'],
                        correct: files['sfxCorrect'],
                        wrong: files['sfxWrong'],
                        win: files['sfxWin'],
                        lose: files['sfxLose']
                    }
                };

                // 4. Вставка в шаблон (Используем ваш код Версии 8 как базу)
                // Для надежности я вставляю JS код как строку
                const gameHTML = getGameTemplate(CONFIG);

                // 5. Скачивание
                const blob = new Blob([gameHTML], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'GrammarBricks_Game.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

            } catch (e) {
                console.error(e);
                alert("Ошибка генерации: " + e.message);
            }

            btn.innerText = "💾 СКАЧАТЬ ИГРУ";
            btn.disabled = false;
        }

        // --- ШАБЛОН ИГРЫ (Движок V8 + Инъекции) ---
        function getGameTemplate(cfg) {
            // Сериализуем данные уровней в JSON
            const levelsJSON = JSON.stringify(cfg.levels);
            const audioJSON = JSON.stringify(cfg.audio);
            
            // CSS для фона
            let bgCSS = "background: transparent;";
            if(cfg.bgImage) bgCSS = `background: url('${cfg.bgImage}') no-repeat center center; background-size: cover;`;
            else if(cfg.bgType === 'color') bgCSS = `background-color: ${cfg.bgColor};`;

            return `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>${cfg.title}</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; ${bgCSS} font-family: ${cfg.font}; user-select: none; -webkit-user-select: none; }
        #game-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        /* SHAKE */
        .shake { animation: shake-animation 0.4s both; }
        .shake-small { animation: shake-small-anim 0.2s both; }
        @keyframes shake-animation { 10%, 90% { transform: translate3d(-5px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-10px, 0, 0); } 40%, 60% { transform: translate3d(10px, 0, 0); } }
        @keyframes shake-small-anim { 0% { transform: translate(0, 0); } 25% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 75% { transform: translate(2px, -2px); } 100% { transform: translate(0, 0); } }

        canvas { display: block; width: 100%; height: 100%; }

        /* OVERLAYS */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 20; transition: opacity 0.3s; }
        .overlay.win-mode { background: rgba(0, 0, 0, 0.1) !important; backdrop-filter: none !important; }
        .hidden { opacity: 0; pointer-events: none; z-index: -1 !important; }

        /* PANELS */
        .neon-panel {
            background: rgba(10, 10, 15, 0.95);
            border: 2px solid ${cfg.neonColor}; 
            box-shadow: 0 0 25px ${cfg.neonColor}, inset 0 0 20px rgba(0, 255, 255, 0.2);
            padding: 35px 30px; border-radius: 20px; color: #fff;
            text-align: center; max-width: 600px; width: 90%; display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin: 0 0 15px 0; text-shadow: 0 0 15px ${cfg.neonColor}; font-size: ${cfg.titleSize}; color: #fff; letter-spacing: 2px; }
        p { margin: 6px 0; font-size: 18px; line-height: 1.3; color: #eee; }

        /* BTN */
        .btn {
            background: transparent !important; border: 3px solid #0f0 !important; color: #0f0 !important;
            padding: 15px 50px !important; font-size: 24px !important; margin-top: 25px !important; margin-bottom: 5px !important;
            cursor: pointer !important; text-transform: uppercase !important; font-weight: 800 !important;
            border-radius: 50px !important; box-shadow: 0 0 20px rgba(0, 255, 0, 0.4), inset 0 0 10px rgba(0, 255, 0, 0.2) !important;
            transition: all 0.3s ease !important; font-family: inherit; letter-spacing: 1px;
        }
        .btn:hover { background: #0f0 !important; color: #000 !important; box-shadow: 0 0 40px #0f0 !important; transform: scale(1.05); }

        /* HUD */
        #hud { position: absolute; top: 15px; left: 0; width: 100%; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 0 0 5px #fff, 0 0 10px #000; z-index: 10; pointer-events: none; }
        .timer-warning { color: #ff3333 !important; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

        /* QUESTIONS */
        .question-box { padding: 40px !important; min-height: 300px; transition: all 0.4s ease; border-color: ${cfg.qFrameColor} !important; box-shadow: 0 0 25px ${cfg.qFrameColor} !important; }
        .q-title { text-transform: uppercase; letter-spacing: 4px; font-size: 28px; margin-bottom: 25px; font-weight: 900; color: ${cfg.qFrameColor}; text-shadow: 0 0 15px ${cfg.qFrameColor}; }
        .q-text { font-size: ${cfg.qTextSize}; margin-bottom: 35px; color: #fff; font-weight: bold; line-height: 1.4; }
        .answers-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .answer-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 18px 25px; cursor: pointer; transition: 0.3s; border-radius: 12px; text-align: left; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 15px; }
        .answer-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(10px); border-color: ${cfg.qFrameColor}; box-shadow: 0 0 15px ${cfg.qFrameColor}; }
        .answer-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: ${cfg.qFrameColor}; box-shadow: 0 0 8px ${cfg.qFrameColor}; }

        /* STATS */
        .stats-table { width: 100%; margin: 15px auto; border-collapse: collapse; font-size: 16px; text-align: left; color: #ddd; }
        .stats-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .stats-table td:last-child { text-align: right; font-weight: bold; color: #fff; }
        .total-row td { font-size: 22px; color: #0ff; text-shadow: 0 0 10px #0ff; border-top: 2px solid #0ff !important; padding-top: 15px; font-weight: bold; }
        #rank-display { font-size: 28px; color: #FFD700; text-shadow: 0 0 20px #FFD700; margin: 15px 0; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        
        #music-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: 2px solid #0ff; color: #0ff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 30; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        #music-btn.off { border-color: #555; color: #555; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="music-btn" class="off">🎵</div>

    <div id="hud" class="hidden">
        <span>Score: <b id="scoreVal">0</b></span>
        <span>Lives: <b id="livesVal">❤️❤️❤️</b></span>
        <span>Combo: x<b id="comboVal">1</b></span>
        <span>Time: <b id="timerVal">60</b>s</span>
        <span id="trophy-hud">🪙 x<b id="trophyVal">0</b></span>
    </div>

    <div id="start-screen" class="overlay">
        <div class="neon-panel">
            <h1>${cfg.title}</h1>
            <div class="rules-container">
                <p>🎯 Control: Mouse or Touch</p>
                <p>🟩 Green / 🟨 Yellow = Questions</p>
                <p>🟦 Blue Bricks drop Power-Ups:</p>
            </div>
            <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 22px; margin: 5px 0 10px 0;">
                <span>🪙</span> <span>❤️</span> <span>⏳</span>
                <span>↔️</span> <span>🥎</span> <span>🐌</span>
            </div>
            <button id="start-btn" class="btn">START GAME</button>
        </div>
    </div>

    <div id="question-modal" class="overlay hidden">
        <div id="q-panel" class="neon-panel question-box">
            <div class="q-title">TASK</div>
            <div id="q-text" class="q-text">...</div>
            <div id="q-answers" class="answers-grid"></div>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <div class="neon-panel">
            <h1 id="end-title">GAME OVER</h1>
            <div id="rank-display" style="display:none;">RANK: NOVICE</div>
            <table class="stats-table">
                <tr><td>Correct:</td><td id="stat-correct">0</td></tr>
                <tr><td>Wrong:</td><td id="stat-wrong">0</td></tr>
                <tr><td>Trophies (🪙):</td><td id="stat-trophies">0</td></tr>
                <tr><td>Time Bonus:</td><td id="stat-time">0</td></tr>
                <tr class="total-row"><td>SCORE:</td><td id="stat-total">0</td></tr>
            </table>
            <button id="restart-btn" class="btn">PLAY AGAIN</button>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        ballSpeed: ${cfg.ballSpeed},
        timeLimit: ${cfg.time},
        lives: ${cfg.lives},
        ballColor: '${cfg.ballColor}',
        winText: '${cfg.winText}',
        loseText: '${cfg.loseText}',
        winEffect: '${cfg.winEffect}',
        levels: ${levelsJSON},
        userAudio: ${audioJSON}
    };
    
    // --- AUDIO SYSTEM ---
    let audioCtx;
    let musicPlaying = false;
    let musicSource = null;
    
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    async function playUserSound(type) {
        if(!audioCtx) return;
        let src = null;
        if(type === 'correct' && CONFIG.userAudio.correct) src = CONFIG.userAudio.correct;
        else if(type === 'wrong' && CONFIG.userAudio.wrong) src = CONFIG.userAudio.wrong;
        else if(type === 'win' && CONFIG.userAudio.win) src = CONFIG.userAudio.win;
        else if(type === 'lose' && CONFIG.userAudio.lose) src = CONFIG.userAudio.lose;
        
        if(src) {
            const response = await fetch(src);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            source.start();
            return true;
        }
        return false;
    }

    async function playSound(type) {
        if (!audioCtx) return;
        // Попытка воспроизвести пользовательский звук
        if(await playUserSound(type)) return;

        // Стандартные звуки (V8 Synth)
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);

        if(type === 'bounce') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if(type === 'tick') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, now);
            gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'correct') { 
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(900, now + 0.15);
            gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'powerup') {
             osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(800, now + 0.3);
             gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
             osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'win') {
            [523, 659, 783, 1046].forEach((f, i) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.2, now + i*0.15); g.gain.exponentialRampToValueAtTime(0.01, now + i*0.15 + 0.4); o.connect(g); g.connect(audioCtx.destination); o.start(now + i*0.15); o.stop(now + i*0.15 + 0.5); });
        } else if (type === 'lose') {
            [392, 349, 311, 261].forEach((f, i) => { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = 'sawtooth'; o.frequency.value = f; g.gain.setValueAtTime(0.2, now + i*0.2); g.gain.exponentialRampToValueAtTime(0.01, now + i*0.2 + 0.4); o.connect(g); g.connect(audioCtx.destination); o.start(now + i*0.2); o.stop(now + i*0.2 + 0.5); });
        }
    }

    // --- MUSIC ---
    async function toggleMusic() {
        initAudio();
        musicPlaying = !musicPlaying;
        const btn = document.getElementById('music-btn');
        
        if(musicPlaying) {
            btn.classList.remove('off');
            if(CONFIG.userAudio.music) {
                // User Music
                if(musicSource) musicSource.stop();
                const response = await fetch(CONFIG.userAudio.music);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                musicSource = audioCtx.createBufferSource();
                musicSource.buffer = audioBuffer;
                musicSource.loop = true;
                musicSource.connect(audioCtx.destination);
                musicSource.start();
            } else {
                // Standard Synth Music (V8)
                startSynthMusic();
            }
        } else {
            btn.classList.add('off');
            if(musicSource) { musicSource.stop(); musicSource = null; }
            stopSynthMusic();
        }
    }
    
    // V8 Synth Music
    let musicInterval, sequenceStep = 0;
    function startSynthMusic() {
        clearInterval(musicInterval);
        musicInterval = setInterval(() => {
            const now = audioCtx.currentTime;
            const happyNotes = [261.63, 329.63, 392.00, 440.00]; 
            const note = happyNotes[sequenceStep % 4];
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(note, now);
            const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, now);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.3);
            sequenceStep++;
        }, 250);
    }
    function stopSynthMusic() { clearInterval(musicInterval); }
    
    document.getElementById('music-btn').addEventListener('click', toggleMusic);

    // --- VISUAL EFFECTS ---
    let particles = [];
    function createVisualEffect() {
        const type = CONFIG.winEffect;
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        
        if(type === 'fireworks') {
            for(let i=0; i<30; i++) particles.push({ x, y: Math.random() * canvas.height/2, dx: (Math.random()-0.5)*8, dy: (Math.random()-0.5)*8, life: 1, color: \`hsl(\${Math.random()*360}, 100%, 50%)\`, type: 'rect' });
        } else if (type === 'bubbles') {
             for(let i=0; i<10; i++) particles.push({ x: Math.random() * canvas.width, y: canvas.height + 10, dx: 0, dy: -2 - Math.random()*3, life: 1, color: '#0ff', type: 'circle', size: 5 + Math.random()*10 });
        } else if (type === 'flowers') {
             particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, life: 1, type: 'flower', color: \`hsl(\${Math.random()*360}, 100%, 70%)\` });
        } else if (type === 'stars') {
             particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, life: 1, type: 'star', color: '#ff0', rot: Math.random() });
        }
    }

    function drawEffects() {
        particles.forEach((p, i) => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            
            if(p.type === 'rect') { // Fireworks
                p.x += p.dx; p.y += p.dy; p.life -= 0.02;
                ctx.fillRect(p.x, p.y, 4, 4);
            } else if (p.type === 'circle') { // Bubbles
                p.y += p.dy; p.x += Math.sin(p.y * 0.05); p.life -= 0.005;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle='#fff'; ctx.stroke();
            } else if (p.type === 'flower') { // Flowers
                p.life -= 0.01;
                ctx.translate(p.x, p.y);
                for(let j=0; j<6; j++) {
                    ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.ellipse(0, 10, 5, 10, 0, 0, Math.PI*2); ctx.fill();
                }
                ctx.setTransform(1,0,0,1,0,0);
            } else if (p.type === 'star') { // Stars
                p.life -= 0.01; p.rot += 0.05;
                ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                ctx.beginPath();
                for(let j=0; j<5; j++) { ctx.lineTo(Math.cos((18+j*72)/180*Math.PI)*10, -Math.sin((18+j*72)/180*Math.PI)*10); ctx.lineTo(Math.cos((54+j*72)/180*Math.PI)*5, -Math.sin((54+j*72)/180*Math.PI)*5); }
                ctx.closePath(); ctx.fill();
                ctx.setTransform(1,0,0,1,0,0);
            }
            
            if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;
    }

    // --- GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let state = 'START';
    let animationId, timerId;
    let stats = { score: 0, correct: 0, wrong: 0, trophies: 0 };
    let lives = 3, combo = 1, timeLeft = CONFIG.timeLimit;
    let paddle = { x: 0, y: 0, w: 100, h: 12, baseW: 100 };
    let balls = []; let bricks = []; let drops = []; 
    let activeQuestion = null; let activeRowIndex = -1;
    let gameWidth, gameHeight;
    const powerUpStack = ['🪙','🪙','❤️','⏳','↔️','🥎','🐌'];

    // Level Management
    let currentLevelIdx = 0;
    let questionsPool = [];

    function resize() {
        const container = document.getElementById('game-container');
        const dpr = window.devicePixelRatio || 1;
        gameWidth = container.clientWidth || 800;
        gameHeight = container.clientHeight || 600;
        canvas.width = gameWidth * dpr; canvas.height = gameHeight * dpr;
        canvas.style.width = gameWidth + 'px'; canvas.style.height = gameHeight + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.scale(dpr, dpr);
        paddle.y = gameHeight - 40;
        paddle.w = Math.max(80, Math.min(200, gameWidth * 0.25)); paddle.baseW = paddle.w;
        if(balls.length === 0 || !balls[0].moving) resetBall();
    }

    function initBricks() {
        bricks = []; drops = [];
        
        // Load Level Data
        if(currentLevelIdx >= CONFIG.levels.length) currentLevelIdx = 0; // Loop or end?
        questionsPool = JSON.parse(JSON.stringify(CONFIG.levels[currentLevelIdx]));
        
        const greenQs = questionsPool.filter(q => q.level === 'easy').length;
        const yellowQs = questionsPool.filter(q => q.level === 'hard').length;
        const totalQs = greenQs + yellowQs;
        
        let rows = 12;
        if(totalQs > 10) rows = Math.min(16, 12 + (totalQs - 10)); // Auto expand rows
        
        const cols = 7;
        const bW = gameWidth / cols;
        const bH = gameHeight * 0.035;

        // Distribute Questions
        let qDeck = [];
        questionsPool.forEach(q => qDeck.push(q.level === 'easy' ? 'green' : 'yellow'));
        // Shuffle deck
        qDeck.sort(() => Math.random() - 0.5);

        for(let r=0; r<rows; r++) {
            let row = [];
            let qType = null;
            if(qDeck.length > 0 && ((rows - r) <= qDeck.length || Math.random() < 0.9)) qType = qDeck.pop();
            let qCol = qType ? Math.floor(Math.random() * cols) : -1;

            for(let c=0; c<cols; c++) {
                let type = 'normal';
                let color = ['#FF69B4', '#BA55D3', '#FFA500', '#20B2AA', '#F0F8FF'][Math.floor(Math.random()*5)];
                let icon = ''; let powerUp = null;

                if(c === qCol) { type = qType; color = (type==='green' ? '#0f0' : '#ff0'); }
                else if(Math.random() < 0.05) { // Random Powerups
                    type = 'bonus'; color = '#00BFFF'; 
                    powerUp = powerUpStack[Math.floor(Math.random()*powerUpStack.length)];
                    icon = powerUp;
                }
                row.push({ x: c * bW + 2, y: r * (bH + 6) + 60, w: bW - 4, h: bH, type, color, active: true, icon, powerUp });
            }
            bricks.push(row);
        }
    }

    function resetBall() {
        balls = [{ x: paddle.x + paddle.w/2, y: paddle.y - 10, r: 8, dx: 0, dy: 0, moving: false, trail: [] }];
    }

    function update() {
        if(state !== 'PLAY') return;
        
        if(timeLeft <= 5 && timeLeft > 0 && Math.floor(Date.now()/1000) % 1 === 0) {
            // Logic for tick is handled in interval, but sound can be here if needed
        }

        // Drops
        for(let i=drops.length-1; i>=0; i--) {
            drops[i].y += 2.5;
            if(drops[i].y > paddle.y && drops[i].x > paddle.x && drops[i].x < paddle.x+paddle.w) {
                activatePowerUp(drops[i].type); drops.splice(i,1);
            } else if(drops[i].y > gameHeight) drops.splice(i,1);
        }

        balls.forEach(ball => {
            if(!ball.moving) { ball.x = paddle.x + paddle.w/2; ball.y = paddle.y - ball.r - 1; return; }
            ball.x += ball.dx; ball.y += ball.dy;
            
            if(ball.x > gameWidth - ball.r || ball.x < ball.r) { ball.dx = -ball.dx; playSound('bounce'); }
            if(ball.y < ball.r) { ball.dy = -ball.dy; playSound('bounce'); }
            
            // Paddle
            if(ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
                ball.dy = -Math.abs(ball.dy);
                ball.dx = ((ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2)) * 7;
                playSound('bounce');
            }
            
            // Bricks
            let hit = false;
            bricks.forEach((row, rIdx) => {
                row.forEach(b => {
                    if(!b.active || hit) return;
                    if(ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
                        ball.dy = -ball.dy; hit = true;
                        if(b.type === 'green' || b.type === 'yellow') { activeRowIndex = rIdx; triggerQuestion(b); }
                        else if (b.type === 'bonus') { b.active = false; drops.push({x: b.x, y: b.y, type: b.powerUp}); }
                        else { b.active = false; stats.score += 10 * combo; playSound('bounce'); updateHUD(); }
                    }
                });
            });

            if(ball.y > gameHeight) ball.dead = true;
        });
        
        balls = balls.filter(b => !b.dead);
        if(balls.length === 0) {
            lives--; combo = 1; updateHUD(); playSound('wrong'); 
            if(lives <= 0) endGame(false); else resetBall();
        }
        
        // Level Clear Check
        if(!bricks.some(row => row.some(b => b.active && (b.type === 'green' || b.type === 'yellow')))) {
            // Next Level? For now just Win
            endGame(true);
        }
    }

    function activatePowerUp(t) {
        playSound('powerup');
        if(t === '🪙') { stats.score += 50; stats.trophies++; }
        else if(t === '❤️') lives++;
        else if(t === '⏳') timeLeft += 20;
        else if(t === '↔️') { paddle.w += 50; setTimeout(()=>paddle.w-=50, 10000); }
        else if(t === '🥎') balls.push({...balls[0], dx: -balls[0].dx, isExtra: true});
        updateHUD();
    }

    function draw() {
        ctx.clearRect(0, 0, gameWidth, gameHeight);
        if(state === 'WIN') { 
            if(Math.random()<0.1) createVisualEffect(); 
            drawEffects();
        }
        
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 10; ctx.shadowColor = '${cfg.neonColor}';
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h); ctx.shadowBlur = 0;
        
        ctx.fillStyle = '${cfg.ballColor}';
        balls.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); });
        
        ctx.font = '24px Arial';
        drops.forEach(d => ctx.fillText(d.type, d.x, d.y));

        bricks.forEach(row => row.forEach(b => {
            if(!b.active) return;
            ctx.fillStyle = b.type==='normal' ? 'rgba(255,255,255,0.1)' : b.color;
            ctx.strokeStyle = b.color; ctx.lineWidth = 2;
            ctx.shadowBlur = 10; ctx.shadowColor = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
            
            if(b.type === 'green' || b.type === 'yellow') {
                 ctx.fillStyle = '#000'; ctx.font = 'bold 18px Arial'; ctx.fillText('?', b.x+b.w/2-5, b.y+b.h/2+6);
            } else if (b.type === 'bonus') {
                 ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.fillText(b.icon, b.x+b.w/2-9, b.y+b.h/2+6);
            }
        }));
    }

    function loop() { update(); draw(); animationId = requestAnimationFrame(loop); }

    function triggerQuestion(brick) {
        state = 'QUESTION';
        document.getElementById('question-modal').classList.remove('hidden');
        const qList = questionsPool.filter(q => q.level === (brick.type === 'green' ? 'easy' : 'hard'));
        // Fallback if runs out
        activeQuestion = qList.length > 0 ? qList[Math.floor(Math.random()*qList.length)] : { q: "No Qs", a: ["Ok"], correct: 0 };
        
        document.getElementById('q-text').innerText = activeQuestion.q;
        const div = document.getElementById('q-answers'); div.innerHTML = '';
        
        // Shuffle Answers for Display but keep track of correct one
        let answersWithIdx = activeQuestion.a.map((txt, i) => ({ txt, isCorrect: i === 0 })); // 0 is always correct in input
        answersWithIdx.sort(() => Math.random() - 0.5);

        answersWithIdx.forEach((item, i) => {
            let btn = document.createElement('div');
            btn.className = 'answer-btn';
            btn.innerHTML = \`<span class="answer-dot"></span> <span>\${item.txt}</span>\`;
            btn.onclick = () => handleAnswer(item.isCorrect);
            div.appendChild(btn);
        });
    }

    function handleAnswer(isCorrect) {
        document.getElementById('question-modal').classList.add('hidden');
        if(isCorrect) {
            playSound('correct'); stats.correct++; stats.score += 100;
            bricks[activeRowIndex].forEach(b => b.active = false);
        } else {
            playSound('wrong'); stats.wrong++; lives--; 
            // document.getElementById('game-container').classList.add('shake');
            bricks[activeRowIndex].forEach(b => { if(b.type !== 'normal' && b.type !== 'bonus') { b.type='normal'; b.color='#fff'; } });
        }
        updateHUD(); if(lives <= 0) endGame(false); else state = 'PLAY';
    }

    function updateHUD() {
        document.getElementById('scoreVal').innerText = stats.score;
        document.getElementById('livesVal').innerText = '❤️'.repeat(Math.max(0, lives));
        document.getElementById('timerVal').innerText = timeLeft;
    }

    function endGame(win) {
        state = win ? 'WIN' : 'END'; clearInterval(timerId);
        document.getElementById('end-screen').classList.remove('hidden'); document.getElementById('hud').classList.add('hidden');
        const title = document.getElementById('end-title');
        title.innerText = win ? CONFIG.winText : CONFIG.loseText;
        title.style.color = win ? '#0f0' : '#f00';
        if(win) { playSound('win'); document.getElementById('rank-display').style.display = 'block'; }
        else { playSound('lose'); document.getElementById('rank-display').style.display = 'none'; }
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        state = 'PLAY'; lives = CONFIG.lives; timeLeft = CONFIG.timeLimit;
        resize(); initBricks(); updateHUD(); balls = []; resetBall();
        
        clearInterval(timerId);
        timerId = setInterval(() => {
            if(state === 'PLAY') {
                timeLeft--; updateHUD();
                if(timeLeft <= 5) playSound('tick');
                if(timeLeft <= 0) endGame(false);
            }
        }, 1000);
        cancelAnimationFrame(animationId); loop();
    }

    document.getElementById('start-btn').onclick = startGame;
    document.getElementById('restart-btn').onclick = startGame;
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        paddle.x = e.clientX - rect.left - paddle.w/2;
        if(balls.length > 0 && !balls[0].moving) balls[0].x = paddle.x + paddle.w/2;
    });
    window.addEventListener('click', () => {
        if(state==='PLAY' && balls.length > 0 && !balls[0].moving) {
            balls[0].moving = true; balls[0].dy = -CONFIG.ballSpeed; balls[0].dx = (Math.random()-0.5)*4;
            initAudio();
        }
    });

    setTimeout(resize, 100);
</script>
</body>
</html>`;
        }
