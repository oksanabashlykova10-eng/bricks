<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Master Editor: Grammar Bricks</title>
    <style>
        :root { --p: #00f3ff; --s: #bc13fe; --bg: #0a0a0f; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Стили боковой панели */
        .sidebar { width: 420px; background: #111; border-right: 2px solid var(--p); display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 40px; }
        .tab-nav { display: flex; background: #000; position: sticky; top: 0; z-index: 5; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #666; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--p); border-bottom-color: var(--p); background: rgba(0,243,255,0.05); }

        .section { padding: 20px; border-bottom: 1px solid #222; }
        .group { margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 5px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; box-sizing: border-box; }
        input[type="color"] { height: 35px; cursor: pointer; padding: 2px; }

        /* Эмблема и Копирайт */
        .brand { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--p); }
        .brand img { width: 35px; filter: drop-shadow(0 0 5px var(--p)); border: 1px solid var(--p); border-radius: 50%; }
        .copyright { font-size: 10px; color: #444; text-align: center; margin-top: 20px; padding: 10px; }

        /* Окна предпросмотра */
        .previews { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #000; }
        .preview-box { flex: 1; border: 1px solid #333; position: relative; border-radius: 8px; overflow: hidden; }
        .preview-box::before { content: attr(data-label); position: absolute; top: 5px; right: 5px; font-size: 10px; background: #222; padding: 2px 6px; border-radius: 4px; z-index: 2; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Кнопка генерации */
        .gen-wrap { padding: 20px; position: sticky; bottom: 0; background: #111; border-top: 1px solid #222; }
        .btn-main { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--p), var(--s)); border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 5px; box-shadow: 0 0 15px rgba(0,243,255,0.3); }

        .level-card { border-left: 3px solid var(--s); padding-left: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand">
        <img src="https://img.genially.com/67961b32a116fb001568a75e/673752a5-8d4d-40d1-9b5f-f04ebd91a27c.png">
        <span style="color:var(--p); font-weight:bold; letter-spacing:1px;">BRICKS EDITOR</span>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="showTab('tab-start')">Экран</button>
        <button class="tab-btn" onclick="showTab('tab-game')">Игра</button>
        <button class="tab-btn" onclick="showTab('tab-levels')">Уровни</button>
    </div>

    <div id="tab-start" class="tab-content">
        <div class="section">
            <div class="group">
                <label>Название игры</label>
                <input type="text" id="gameName" value="Grammar Bricks" oninput="updatePreview()">
            </div>
            <div class="group">
                <label>Шрифт заголовка</label>
                <select id="titleFont" onchange="updatePreview()">
                    <option value="'Courier New'">Courier New</option>
                    <option value="Arial">Arial</option>
                    <option value="'Comic Sans MS'">Comic Sans</option>
                    <option value="serif">Times New Roman</option>
                </select>
            </div>
            <div class="row" style="display:flex; gap:10px;">
                <div class="group" style="flex:1">
                    <label>Размер шрифта</label>
                    <input type="number" id="titleSize" value="48" oninput="updatePreview()">
                </div>
                <div class="group" style="flex:1">
                    <label>Цвет неона</label>
                    <input type="color" id="neonColor" value="#00ffff" oninput="updatePreview()">
                </div>
            </div>
        </div>
    </div>

    <div id="tab-game" class="tab-content" style="display:none">
        <div class="section">
            <div class="group">
                <label>Шрифт в окне вопроса</label>
                <select id="qFont" onchange="updatePreview()">
                    <option value="'Comic Sans MS'">Comic Sans MS</option>
                    <option value="'Courier New'">Courier New</option>
                    <option value="Arial">Arial</option>
                </select>
            </div>
            <div class="row" style="display:flex; gap:10px;">
                <div class="group" style="flex:1">
                    <label>Таймер (сек)</label>
                    <input type="number" id="gameTime" value="90">
                </div>
                <div class="group" style="flex:1">
                    <label>Жизни</label>
                    <input type="number" id="gameLives" value="3">
                </div>
            </div>
            <div class="group">
                <label>Цвет/Фон игры</label>
                <select id="bgType" onchange="updatePreview()">
                    <option value="transparent">Прозрачный</option>
                    <option value="color">Цвет</option>
                    <option value="image">Своя картинка</option>
                </select>
                <input type="color" id="bgColor" value="#000000" style="margin-top:5px; display:none">
                <input type="file" id="bgFile" style="margin-top:5px; display:none" onchange="readImage(this)">
            </div>
        </div>
    </div>

    <div id="tab-levels" class="tab-content" style="display:none">
        <div class="section" id="levelsContainer">
            </div>
        <button onclick="addLevel()" style="margin: 0 20px; width: calc(100% - 40px); background:#222; border:1px dashed var(--p); color:var(--p); padding:10px; cursor:pointer;">+ Добавить уровень</button>
    </div>

    <div class="copyright">
        © Все права принадлежат Башлыковой Оксане Михайловне
    </div>

    <div class="gen-wrap">
        <button class="btn-main" onclick="generateEmbedCode()">ПОЛУЧИТЬ КОД ДЛЯ GENIALLY</button>
    </div>
</div>

<div class="previews">
    <div class="preview-box" data-label="Стартовый экран">
        <iframe id="preStart"></iframe>
    </div>
    <div class="preview-box" data-label="Окно вопроса">
        <iframe id="preQuestion"></iframe>
    </div>
</div>

<script>
    let levels = [{
        easyQ: "She ___ (go) to school.\nI ___ apple.",
        easyA: "goes|go|going\neat|ate|eaten",
        hardQ: "If I ___ you...\nHe ___ seen it.",
        hardA: "were|was|am\nhad|has|have"
    }];

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        event.target.classList.add('active');
    }

    function addLevel() {
        levels.push({easyQ: "", easyA: "", hardQ: "", hardA: ""});
        renderLevels();
    }

    function removeLevel(i) {
        if(levels.length > 1) {
            levels.splice(i, 1);
            renderLevels();
        }
    }

    function renderLevels() {
        const cont = document.getElementById('levelsContainer');
        cont.innerHTML = '';
        levels.forEach((lvl, i) => {
            cont.innerHTML += `
                <div class="level-card">
                    <div style="display:flex; justify-content:space-between">
                        <b>Уровень ${i+1}</b>
                        <button onclick="removeLevel(${i})" style="background:none; border:none; color:red; cursor:pointer">🗑️</button>
                    </div>
                    <label>Вопросы (Easy)</label>
                    <textarea oninput="levels[${i}].easyQ = this.value">${lvl.easyQ}</textarea>
                    <label>Ответы (Easy)</label>
                    <textarea oninput="levels[${i}].easyA = this.value" placeholder="Ответ|Неверно|Неверно">${lvl.easyA}</textarea>
                </div>
            `;
        });
    }

    function updatePreview() {
        const neon = document.getElementById('neonColor').value;
        const font = document.getElementById('titleFont').value;
        const qFont = document.getElementById('qFont').value;
        const name = document.getElementById('gameName').value;
        const size = document.getElementById('titleSize').value;

        // Предпросмотр старта
        const startHTML = `
            <style>
                body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: ${font}; }
                .panel { border: 2px solid ${neon}; padding: 40px; text-align: center; border-radius: 20px; box-shadow: 0 0 20px ${neon}; }
                h1 { color: #fff; font-size: ${size}px; text-shadow: 0 0 10px ${neon}; margin: 0; }
                .btn { margin-top: 20px; display: inline-block; padding: 10px 30px; border: 2px solid ${neon}; color: ${neon}; border-radius: 50px; text-transform: uppercase; font-weight: bold; }
            </style>
            <div class="panel">
                <h1>${name}</h1>
                <div class="btn">START GAME</div>
            </div>
        `;
        document.getElementById('preStart').srcdoc = startHTML;

        // Предпросмотр вопроса
        const questionHTML = `
            <style>
                body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: ${qFont}; }
                .q-box { width: 80%; border: 3px solid ${neon}; background: rgba(0,0,0,0.9); border-radius: 15px; padding: 20px; color: #fff; box-shadow: 0 0 15px ${neon}; }
                .ans { margin-top: 10px; padding: 10px; border: 1px solid #555; border-radius: 5px; background: rgba(255,255,255,0.05); }
            </style>
            <div class="q-box">
                <div style="font-size: 1.2em; margin-bottom: 15px;">Example Question Text?</div>
                <div class="ans" style="border-color:${neon}">Correct Answer</div>
                <div class="ans">Wrong Answer A</div>
                <div class="ans">Wrong Answer B</div>
            </div>
        `;
        document.getElementById('preQuestion').srcdoc = questionHTML;
    }

    function generateEmbedCode() {
        // Здесь мы берем ваш идеальный код и заменяем в нем только объект CONFIG
        const finalConfig = {
            title: document.getElementById('gameName').value,
            titleFont: document.getElementById('titleFont').value,
            titleSize: document.getElementById('titleSize').value,
            qFont: document.getElementById('qFont').value,
            neon: document.getElementById('neonColor').value,
            time: document.getElementById('gameTime').value,
            lives: document.getElementById('gameLives').value,
            levels: levels
        };

        const embedCode = `
            <div style="width: 100%; height: 600px;">
                <iframe srcdoc='
                    <html>...Игра работает...</html>
                ' width="100%" height="100%" frameborder="0" allowtransparency="true"></iframe>
            </div>
        `;
        
        // Для простоты я выведу конфиг в консоль или алертом, 
        // но технически сюда вставляется ваш текст файла .txt с заменой блока script в начале
        alert("Код для Genially сформирован! (В реальной версии тут будет полный текст вашего файла)");
        console.log(finalConfig);
    }

    renderLevels();
    updatePreview();
</script>
</body>
</html>
