<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Master Editor: Original Version</title>
    <style>
        :root { --p: #00f3ff; --bg: #121212; --panel: #1e1e24; --text: #eee; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 440px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.5); z-index: 10; }
        
        .logo-area { padding: 15px; background: #000; border-bottom: 1px solid var(--p); display: flex; align-items: center; gap: 10px; }
        .logo-area img { height: 40px; }
        .logo-area span { font-weight: bold; color: var(--p); letter-spacing: 1px; }

        .tabs { display: flex; background: #111; border-bottom: 1px solid #333; position: sticky; top:0; z-index: 5; }
        .tab { flex: 1; padding: 12px; background: none; border: none; color: #777; cursor: pointer; border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600; }
        .tab.active { color: var(--p); border-bottom-color: var(--p); background: rgba(0, 243, 255, 0.05); }

        .content { padding: 15px; }
        .section { margin-bottom: 20px; border: 1px solid #333; padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.2); }
        .section-title { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        .control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .control-col { flex: 1; }
        label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
        
        input, select, textarea { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input[type="color"] { padding: 0; height: 30px; cursor: pointer; }
        input[type="checkbox"] { width: auto; transform: scale(1.2); }
        input[type="range"] { -webkit-appearance: none; background: #333; height: 5px; border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: var(--p); border-radius: 50%; cursor: pointer; }

        /* PREVIEW AREA */
        .preview-area { flex: 1; display: flex; flex-direction: column; background: #000; padding: 20px; gap: 20px; overflow-y: auto; }
        .preview-card { border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; }
        .preview-header { padding: 8px 15px; background: #1a1a1a; border-bottom: 1px solid #333; font-size: 12px; color: #aaa; display: flex; justify-content: space-between; align-items: center; }
        iframe { border: none; width: 100%; height: 100%; display: block; }

        .btn-gen { background: linear-gradient(90deg, #00f3ff, #0066ff); border: none; color: #fff; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: auto; position: sticky; bottom: 0; }
        .btn-gen:hover { filter: brightness(1.2); }

        .color-palette { display: flex; gap: 5px; margin-top: 5px; }
        .color-swatch { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid #333; }
        .color-swatch:hover { transform: scale(1.1); border-color: #fff; }

        /* Specific Toggles */
        .toggle-group { background: #111; padding: 5px; border-radius: 20px; display: inline-flex; gap: 5px; }
        .toggle-btn { border: none; background: transparent; color: #555; padding: 5px 15px; border-radius: 15px; cursor: pointer; font-size: 12px; }
        .toggle-btn.active { background: #333; color: #fff; }

        /* Level Items */
        .level-item { border-left: 3px solid #00f3ff; padding-left: 10px; margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 10px; }
        .trash-btn { float: right; cursor: pointer; color: #f55; background: none; border: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-area">
        <img src="https://img.genially.com/67961b32a116fb001568a75e/673752a5-8d4d-40d1-9b5f-f04ebd91a27c.png" alt="Logo">
        <span>BRICKS EDITOR</span>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="setTab('main')">Главная</button>
        <button class="tab" onclick="setTab('questions')">Вопросы</button>
        <button class="tab" onclick="setTab('levels')">Уровни</button>
        <button class="tab" onclick="setTab('audio')">Аудио</button>
    </div>

    <div id="tab-main" class="content">
        <div class="section">
            <div class="section-title">Начальный Экран</div>
            <div class="control-row">
                <div class="control-col">
                    <label>Заголовок</label>
                    <input type="text" id="gameTitle" value="Grammar Bricks" oninput="up()">
                </div>
            </div>
            <div class="control-row">
                 <div class="control-col">
                    <label>Шрифт заголовка</label>
                    <select id="titleFont" onchange="up()">
                        <option value="'Courier New', monospace">Courier New</option>
                        <option value="'Comic Sans MS', cursive">Comic Sans</option>
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="serif">Times New Roman</option>
                    </select>
                 </div>
                 <div class="control-col">
                     <label>Размер</label>
                     <input type="number" id="titleSize" value="48" oninput="up()">
                 </div>
            </div>
            <div class="control-row">
                <div class="control-col"><label>Цвет текста</label><input type="color" id="titleColor" value="#ffffff" oninput="up()"></div>
                <div class="control-col" style="flex:0.2"><label>Неон</label><input type="checkbox" id="hasNeon" checked onchange="up()"></div>
                <div class="control-col"><label>Цвет Неона</label><input type="color" id="neonColor" value="#00ffff" oninput="up()"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Настройки Игры</div>
            <div class="control-row">
                <div class="control-col">
                    <label>Фон игры</label>
                    <select id="bgType" onchange="toggleBg(this.value); up()">
                        <option value="transparent">Прозрачный (для Genially)</option>
                        <option value="color">Цвет</option>
                        <option value="image">Картинка</option>
                    </select>
                    <div id="bgColorUI" style="display:none; margin-top:5px;">
                        <input type="color" id="bgColor" value="#111111" oninput="up()">
                        <div class="color-palette">
                            <div class="color-swatch" style="background:#000" onclick="setBg('#000000')"></div>
                            <div class="color-swatch" style="background:#1a1a2e" onclick="setBg('#1a1a2e')"></div>
                            <div class="color-swatch" style="background:#2e1a1a" onclick="setBg('#2e1a1a')"></div>
                            <div class="color-swatch" style="background:#1a2e1a" onclick="setBg('#1a2e1a')"></div>
                        </div>
                    </div>
                    <input type="file" id="bgFile" style="display:none; margin-top:5px;" onchange="readImg(this)">
                </div>
            </div>
            <div class="control-row">
                <div class="control-col">
                    <label>Скорость шара (1-5)</label>
                    <input type="range" id="ballSpeed" min="1" max="5" value="3" step="1">
                </div>
                <div class="control-col">
                    <label>Таймер (макс 180с)</label>
                    <input type="number" id="gameTime" value="90" max="180">
                </div>
            </div>
             <div class="control-row">
                 <div class="control-col">
                    <label>Жизни</label>
                    <input type="number" id="lives" value="3" max="10">
                 </div>
                 <div class="control-col">
                    <label>Цвет шара</label>
                    <input type="color" id="ballColor" value="#ffffff" oninput="up()">
                 </div>
            </div>
            <div class="control-row">
                <div class="control-col">
                    <label>Эффект победы</label>
                    <select id="winEffect">
                        <option value="fireworks">🎆 Фейерверк</option>
                        <option value="bubbles">🫧 Пузырьки</option>
                        <option value="flowers">🌸 Цветочки</option>
                        <option value="stars">⭐ Звездочки</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Финальные экраны</div>
            <label>Текст Победы</label>
            <input type="text" id="winTxt" value="VICTORY!">
            <label style="margin-top:5px">Текст Поражения</label>
            <input type="text" id="loseTxt" value="GAME OVER">
        </div>
    </div>

    <div id="tab-questions" class="content" style="display:none">
        <div class="section" style="border-left: 3px solid #00ff00;">
            <div class="section-title" style="color:#00ff00">ЗЕЛЕНЫЕ ВОПРОСЫ (ЛЕГКИЕ)</div>
            <label>Шрифт</label>
            <select id="qFontEasy" onchange="up()">
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Comic Sans MS', cursive">Comic Sans</option>
                <option value="Arial, sans-serif">Arial</option>
            </select>
            <div class="control-row">
                <div class="control-col"><label>Размер</label><input type="number" id="qSizeEasy" value="24" oninput="up()"></div>
                <div class="control-col"><label>Текст</label><input type="color" id="qColEasy" value="#ffffff" oninput="up()"></div>
                <div class="control-col"><label>Рамка</label><input type="color" id="qNeonEasy" value="#00ff00" oninput="up()"></div>
            </div>
        </div>

        <div class="section" style="border-left: 3px solid #ffff00;">
            <div class="section-title" style="color:#ffff00">ЖЕЛТЫЕ ВОПРОСЫ (СЛОЖНЫЕ)</div>
            <label>Шрифт</label>
            <select id="qFontHard" onchange="up()">
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Comic Sans MS', cursive">Comic Sans</option>
                <option value="Arial, sans-serif">Arial</option>
            </select>
            <div class="control-row">
                <div class="control-col"><label>Размер</label><input type="number" id="qSizeHard" value="20" oninput="up()"></div>
                <div class="control-col"><label>Текст</label><input type="color" id="qColHard" value="#ffffff" oninput="up()"></div>
                <div class="control-col"><label>Рамка</label><input type="color" id="qNeonHard" value="#ffff00" oninput="up()"></div>
            </div>
        </div>
    </div>

    <div id="tab-levels" class="content" style="display:none">
        <div id="levels-container"></div>
        <button onclick="addLevel()" style="width:100%; padding:10px; background:#222; border:1px dashed #555; color:#fff; cursor:pointer">+ Добавить Уровень</button>
    </div>

    <div id="tab-audio" class="content" style="display:none">
        <div class="section">
            <div class="section-title">Загрузка звуков</div>
            <label>Правильный ответ</label><input type="file" onchange="loadAudio('correct', this)">
            <label style="margin-top:5px">Неправильный ответ</label><input type="file" onchange="loadAudio('wrong', this)">
            <label style="margin-top:5px">Победа (Финал)</label><input type="file" onchange="loadAudio('win', this)">
            <label style="margin-top:5px">Провал (Финал)</label><input type="file" onchange="loadAudio('lose', this)">
        </div>
    </div>

    <button class="btn-gen" onclick="generateCode()">СКОПИРОВАТЬ КОД ДЛЯ GENIALLY</button>
</div>

<div class="preview-area">
    <div class="preview-card" style="height: 300px;">
        <div class="preview-header">
            <span>СТАРТОВЫЙ ЭКРАН</span>
        </div>
        <iframe id="frameStart"></iframe>
    </div>

    <div class="preview-card" style="height: 300px;">
        <div class="preview-header">
            <span>ОКНО ВОПРОСА</span>
            <div class="toggle-group">
                <button class="toggle-btn active" onclick="setQMode('easy', this)">EASY (GREEN)</button>
                <button class="toggle-btn" onclick="setQMode('hard', this)">HARD (YELLOW)</button>
            </div>
        </div>
        <iframe id="frameQ"></iframe>
    </div>
</div>

<script>
// --- STATE & DATA ---
let levels = [{
    easyQ: "She ___ to school.\nI ___ apples.",
    easyA: "goes|go|going\nlike|likes|liking",
    hardQ: "If I ___ you...\nShe ___ seen it.",
    hardA: "were|was|am\nhad|has|have"
}];
let audioData = { correct:null, wrong:null, win:null, lose:null };
let bgImage = null;
let qPreviewMode = 'easy';

// --- INITIALIZATION ---
function init() {
    renderLevels();
    up();
}

function setTab(id) {
    document.querySelectorAll('.content').forEach(d => d.style.display='none');
    document.getElementById('tab-'+id).style.display='block';
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
}

function toggleBg(val) {
    document.getElementById('bgColorUI').style.display = val === 'color' ? 'block' : 'none';
    document.getElementById('bgFile').style.display = val === 'image' ? 'block' : 'none';
}
function setBg(c) { document.getElementById('bgColor').value = c; up(); }

function setQMode(mode, btn) {
    qPreviewMode = mode;
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    up();
}

// --- LOGIC ---
function addLevel() {
    levels.push({ easyQ: "", easyA: "", hardQ: "", hardA: "" });
    renderLevels();
}
function removeLevel(i) {
    if(levels.length>1) { levels.splice(i,1); renderLevels(); }
}
function renderLevels() {
    const c = document.getElementById('levels-container');
    c.innerHTML = '';
    levels.forEach((l, i) => {
        c.innerHTML += `
        <div class="level-item">
            <button class="trash-btn" onclick="removeLevel(${i})">🗑️</button>
            <div style="font-weight:bold; margin-bottom:5px">Уровень ${i+1}</div>
            <label style="color:#0f0">Зеленые вопросы (Easy)</label>
            <textarea rows="3" oninput="levels[${i}].easyQ=this.value">${l.easyQ}</textarea>
            <label>Ответы</label>
            <textarea rows="2" oninput="levels[${i}].easyA=this.value">${l.easyA}</textarea>
            
            <label style="color:#ff0; margin-top:10px">Желтые вопросы (Hard)</label>
            <textarea rows="3" oninput="levels[${i}].hardQ=this.value">${l.hardQ}</textarea>
            <label>Ответы</label>
            <textarea rows="2" oninput="levels[${i}].hardA=this.value">${l.hardA}</textarea>
        </div>`;
    });
}

function readImg(input) {
    if(input.files[0]) {
        const r = new FileReader();
        r.onload = e => { bgImage = e.target.result; up(); };
        r.readAsDataURL(input.files[0]);
    }
}
function loadAudio(key, input) {
    if(input.files[0]) {
        const r = new FileReader();
        r.onload = e => { audioData[key] = e.target.result; alert('Звук загружен!'); };
        r.readAsDataURL(input.files[0]);
    }
}

// --- PREVIEWS (THE CORE) ---
function up() {
    // Collect settings
    const title = document.getElementById('gameTitle').value;
    const titleFont = document.getElementById('titleFont').value;
    const titleSize = document.getElementById('titleSize').value;
    const titleColor = document.getElementById('titleColor').value;
    const hasNeon = document.getElementById('hasNeon').checked;
    const neonColor = hasNeon ? document.getElementById('neonColor').value : 'rgba(0,0,0,0)';
    
    const bgType = document.getElementById('bgType').value;
    const bgCSS = bgType==='transparent' ? 'transparent' : (bgType==='color' ? document.getElementById('bgColor').value : `url('${bgImage}') center/cover`);

    const qFont = qPreviewMode==='easy' ? document.getElementById('qFontEasy').value : document.getElementById('qFontHard').value;
    const qSize = qPreviewMode==='easy' ? document.getElementById('qSizeEasy').value : document.getElementById('qSizeHard').value;
    const qCol = qPreviewMode==='easy' ? document.getElementById('qColEasy').value : document.getElementById('qColHard').value;
    const qNeon = qPreviewMode==='easy' ? document.getElementById('qNeonEasy').value : document.getElementById('qNeonHard').value;

    // PREVIEW: START SCREEN (Original Design)
    const cssStart = `
        body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:${bgCSS}; font-family:${titleFont}; }
        .panel { 
            text-align: center; 
            padding: 40px; 
            border: 4px solid ${neonColor}; 
            border-radius: 20px; 
            box-shadow: 0 0 30px ${neonColor}, inset 0 0 20px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.8);
            min-width: 300px;
        }
        h1 { margin:0 0 30px; font-size:${titleSize}px; color:${titleColor}; text-shadow: 0 0 15px ${neonColor}; }
        .btn {
            background: transparent;
            border: 2px solid ${neonColor};
            color: ${neonColor};
            padding: 15px 40px;
            font-size: 24px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px ${neonColor};
        }
    `;
    document.getElementById('frameStart').srcdoc = `<html><style>${cssStart}</style><body><div class="panel"><h1>${title}</h1><button class="btn">START</button></div></body></html>`;

    // PREVIEW: QUESTION (Original Design)
    const cssQ = `
        body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#111; font-family:${qFont}; }
        .q-box {
            width: 80%;
            border: 3px solid ${qNeon};
            background: #000;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 25px ${qNeon};
            color: ${qCol};
            text-align: center;
        }
        .q-text { font-size: ${qSize}px; margin-bottom: 20px; }
        .ans { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid #555; 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 5px; 
            color: #fff;
        }
    `;
    document.getElementById('frameQ').srcdoc = `<html><style>${cssQ}</style><body><div class="q-box"><div class="q-text">${qPreviewMode==='easy' ? 'Easy Question Example?' : 'Hard Question Example?'}</div><div class="ans">Answer A</div><div class="ans">Answer B</div></div></body></html>`;
}

// --- GENERATOR ---
function generateCode() {
    // Gather ALL Data
    const cfg = {
        title: document.getElementById('gameTitle').value,
        titleFont: document.getElementById('titleFont').value,
        titleSize: document.getElementById('titleSize').value,
        titleColor: document.getElementById('titleColor').value,
        neon: document.getElementById('hasNeon').checked ? document.getElementById('neonColor').value : 'rgba(0,0,0,0)',
        
        bgType: document.getElementById('bgType').value,
        bgVal: document.getElementById('bgType').value==='color' ? document.getElementById('bgColor').value : (bgImage || ''),
        
        speed: parseInt(document.getElementById('ballSpeed').value) * 2 + 1, // Map 1-5 to 3-11
        time: Math.min(180, parseInt(document.getElementById('gameTime').value)),
        lives: document.getElementById('lives').value,
        ballC: document.getElementById('ballColor').value,
        winEff: document.getElementById('winEffect').value,
        winTxt: document.getElementById('winTxt').value,
        loseTxt: document.getElementById('loseTxt').value,

        easy: { font: document.getElementById('qFontEasy').value, size: document.getElementById('qSizeEasy').value, col: document.getElementById('qColEasy').value, neon: document.getElementById('qNeonEasy').value },
        hard: { font: document.getElementById('qFontHard').value, size: document.getElementById('qSizeHard').value, col: document.getElementById('qColHard').value, neon: document.getElementById('qNeonHard').value }
    };

    // Clean levels
    const cleanLevels = levels.map(l => ({
        eq: l.easyQ.split('\n').filter(x=>x), ea: l.easyA.split('\n').filter(x=>x),
        hq: l.hardQ.split('\n').filter(x=>x), ha: l.hardA.split('\n').filter(x=>x)
    }));

    // The Game Code (File 9 Reconstruction with Variable Injection)
    const gameCode = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; font-family:${cfg.titleFont}; user-select:none; }
    #game-container { position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
    
    /* BACKGROUND LOGIC */
    .bg-layer { position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; }
    ${cfg.bgType==='color' ? `.bg-layer{background:${cfg.bgVal}}` : (cfg.bgType==='image' ? `.bg-layer{background:url('${cfg.bgVal}') center/cover}` : '')}

    canvas { display:block; }
    .hidden { display:none !important; }
    .overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100; display:flex; justify-content:center; align-items:center; }

    /* YOUR ORIGINAL STYLES */
    .panel { 
        background: rgba(10,10,15,0.95); 
        border: 4px solid ${cfg.neon}; 
        padding: 40px; 
        border-radius: 20px; 
        text-align: center; 
        box-shadow: 0 0 30px ${cfg.neon}, inset 0 0 20px rgba(0,0,0,0.5);
        color: ${cfg.titleColor};
        min-width: 320px;
    }
    .panel h1 { margin:0 0 20px; font-size:${cfg.titleSize}px; font-family:${cfg.titleFont}; text-shadow:0 0 15px ${cfg.neon}; }
    .btn { 
        background: transparent; 
        border: 2px solid ${cfg.neon}; 
        color: ${cfg.neon}; 
        padding: 12px 35px; 
        font-size: 24px; 
        cursor: pointer; 
        border-radius: 50px; 
        font-family: inherit; 
        font-weight: bold; 
        transition: 0.3s; 
        margin-top: 20px;
        box-shadow: 0 0 15px ${cfg.neon};
    }
    .btn:hover { background: ${cfg.neon}; color: #000; }

    /* QUESTION STYLES (Dynamic based on type) */
    .q-box { width: 80%; max-width: 500px; padding: 25px; border-radius: 15px; background: #000; text-align: center; border: 3px solid #fff; box-shadow: 0 0 20px #fff; }
    .ans-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.1); border: 1px solid #555; color: #fff; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size:18px; }
    .ans-btn:hover { background: rgba(255,255,255,0.25); border-color:#fff; }
    
    #hud { position:absolute; top:10px; width:100%; text-align:center; color:#fff; font-family:'Courier New'; font-weight:bold; font-size:24px; pointer-events:none; z-index:10; text-shadow:2px 2px 2px #000; }
    .timer-warn { color: #f00; animation: pulse 0.5s infinite; }
    @keyframes pulse { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
    .shake { animation: shake 0.4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
</style>
</head>
<body>
<div id="game-container">
    <div class="bg-layer"></div>
    <canvas id="cvs"></canvas>
    
    <div id="hud" class="hidden">
        SCORE: <span id="sc">0</span> | LIVES: <span id="lv"></span> | TIME: <span id="tm"></span>
    </div>

    <div id="start-screen" class="overlay">
        <div class="panel">
            <h1>${cfg.title}</h1>
            <button class="btn" onclick="startGame()">START</button>
        </div>
    </div>

    <div id="q-screen" class="overlay hidden">
        <div id="q-panel" class="q-box">
            <div id="q-text" style="margin-bottom:20px;"></div>
            <div id="q-ans"></div>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <div class="panel">
            <h1 id="end-title"></h1>
            <p style="font-size:20px">SCORE: <span id="end-score"></span></p>
            <button class="btn" onclick="startGame()">REPLAY</button>
        </div>
    </div>
</div>

<script>
// CONFIG INJECTION
const CFG = ${JSON.stringify(cfg)};
const LEVELS = ${JSON.stringify(cleanLevels)};
const AUDIO = ${JSON.stringify(audioData)};

// ENGINE
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let w, h, paddle, ball, bricks=[], particles=[], timer, timeLeft, stats={sc:0, lv:3, lvl:0};
let state = 'START';
let audioCtx;

function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playSnd(key) {
    if(!audioCtx) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(AUDIO[key]) {
        fetch(AUDIO[key]).then(r=>r.arrayBuffer()).then(d=>audioCtx.decodeAudioData(d, b=>{
            const s=audioCtx.createBufferSource(); s.buffer=b; s.connect(audioCtx.destination); s.start(0);
        }));
    } else {
        // Fallback synths
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        if(key==='hit'){ o.frequency.value=400; o.type='square'; g.gain.value=0.1; o.start(); o.stop(audioCtx.currentTime+0.1); }
        if(key==='wrong'){ o.frequency.value=150; o.type='sawtooth'; g.gain.value=0.2; o.start(); o.stop(audioCtx.currentTime+0.4); }
    }
}

function resize() { 
    w=cvs.width=document.getElementById('game-container').offsetWidth; 
    h=cvs.height=document.getElementById('game-container').offsetHeight; 
    paddle={x:w/2-60, y:h-40, w:120, h:15}; 
    if(state!=='PLAY') resetBall();
}
window.onresize = resize;

function initBricks() {
    bricks = [];
    const l = LEVELS[stats.lvl % LEVELS.length];
    let pool = [];
    l.eq.forEach((q,i)=>pool.push({q, a:l.ea[i], t:'easy'}));
    l.hq.forEach((q,i)=>pool.push({q, a:l.ha[i], t:'hard'}));
    
    // Grid logic (Original)
    let rows = 6 + Math.min(6, Math.floor(pool.length/2));
    let cols = 6, bw = w/cols, bh = h*0.05;
    
    for(let r=0; r<rows; r++) {
        let qIdx = (pool.length && Math.random()>0.5) ? Math.floor(Math.random()*cols) : -1;
        for(let c=0; c<cols; c++) {
            let b = {x:c*bw+2, y:r*(bh+5)+60, w:bw-4, h:bh, a:true, type:'n', c:'rgba(255,255,255,0.15)'};
            if(c===qIdx && pool.length) {
                let p = pool.shift();
                b.type = p.t; b.q = p; b.c = p.t==='easy' ? '#0f0' : '#ff0';
            }
            bricks.push(b);
        }
    }
}

function resetBall() { ball={x:paddle.x+60, y:paddle.y-20, r:8, dx:0, dy:0, mov:false}; }

function update() {
    if(state!=='PLAY') return;
    // Paddle (Mouse)
    if(!ball.mov) ball.x = paddle.x+60;
    
    if(ball.mov) {
        ball.x+=ball.dx; ball.y+=ball.dy;
        if(ball.x<0 || ball.x>w) { ball.dx*=-1; playSnd('hit'); }
        if(ball.y<0) { ball.dy*=-1; playSnd('hit'); }
        if(ball.y+8 > paddle.y && ball.x>paddle.x && ball.x<paddle.x+paddle.w) {
            ball.dy = -Math.abs(ball.dy);
            let hitPos = (ball.x - (paddle.x+60))/60; 
            ball.dx = hitPos * 5; 
            playSnd('hit');
        }
        
        // Bricks
        bricks.forEach(b => {
            if(!b.a) return;
            if(ball.x>b.x && ball.x<b.x+b.w && ball.y>b.y && ball.y<b.y+b.h) {
                ball.dy*=-1;
                if(b.type === 'n') { b.a=false; stats.sc+=10; playSnd('hit'); }
                else { ask(b); }
            }
        });

        if(ball.y > h) {
            stats.lv--; updHUD(); playSnd('wrong');
            document.getElementById('game-container').classList.add('shake');
            setTimeout(()=>document.getElementById('game-container').classList.remove('shake'), 400);
            if(stats.lv<=0) end(false); else resetBall();
        }
    }
    
    // Particles
    particles.forEach((p,i) => {
        p.x+=p.dx; p.y+=p.dy; p.l-=0.02;
        if(p.l<=0) particles.splice(i,1);
    });
}

function draw() {
    ctx.clearRect(0,0,w,h);
    // Paddle
    ctx.fillStyle='#fff'; ctx.shadowBlur=20; ctx.shadowColor=CFG.neon;
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    
    // Ball
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle=CFG.ballC; ctx.fill();
    ctx.shadowBlur=0;

    // Bricks
    bricks.forEach(b => {
        if(!b.a) return;
        ctx.fillStyle = b.c;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle='#000'; ctx.strokeRect(b.x, b.y, b.w, b.h);
        if(b.type!=='n') {
            ctx.fillStyle='#000'; ctx.font='bold 14px Arial'; ctx.fillText('?', b.x+b.w/2-4, b.y+b.h/2+5);
        }
    });
    
    // Particles
    particles.forEach(p => {
        ctx.fillStyle=p.c; ctx.globalAlpha=p.l;
        if(CFG.winEff==='bubbles') { ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); }
        else if(CFG.winEff==='stars') { ctx.font=p.s*3+'px Arial'; ctx.fillText('⭐',p.x,p.y); }
        else if(CFG.winEff==='flowers') { ctx.font=p.s*3+'px Arial'; ctx.fillText('🌸',p.x,p.y); }
        else { ctx.fillRect(p.x,p.y,p.s,p.s); }
    });
    ctx.globalAlpha=1;
}

function ask(b) {
    state = 'Q';
    const box = document.getElementById('q-panel');
    const txt = document.getElementById('q-text');
    const ans = document.getElementById('q-ans');
    const s = b.type==='easy' ? CFG.easy : CFG.hard;

    // Apply styles dynamically
    box.style.borderColor = s.neon;
    box.style.boxShadow = '0 0 25px '+s.neon;
    txt.style.fontFamily = s.font;
    txt.style.fontSize = s.size+'px';
    txt.style.color = s.col;
    txt.innerText = b.q.q;

    ans.innerHTML = '';
    const opts = b.q.a.split('|');
    const corr = opts[0];
    opts.sort(()=>Math.random()-0.5).forEach(o => {
        const btn = document.createElement('div');
        btn.className = 'ans-btn';
        btn.innerText = o;
        btn.style.fontFamily = s.font;
        btn.onclick = () => {
            document.getElementById('q-screen').classList.add('hidden');
            if(o===corr) {
                b.a=false; stats.sc+=100; playSnd('correct');
                bricks.forEach(br => { if(Math.abs(br.y-b.y)<5) br.a=false; }); // Clear row
            } else {
                stats.lv--; updHUD(); playSnd('wrong');
                if(stats.lv<=0) end(false);
            }
            if(state!=='END') state='PLAY';
        };
        ans.appendChild(btn);
    });

    document.getElementById('q-screen').classList.remove('hidden');
}

function startGame() {
    initAudio();
    document.querySelectorAll('.overlay').forEach(o=>o.classList.add('hidden'));
    document.getElementById('hud').classList.remove('hidden');
    stats.sc=0; stats.lv=CFG.lives; timeLeft=CFG.time;
    resize(); initBricks(); resetBall(); updHUD();
    state = 'PLAY';
    clearInterval(timer);
    timer = setInterval(() => {
        if(state==='PLAY') {
            timeLeft--; updHUD();
            if(timeLeft<=0) end(false);
        }
    }, 1000);
    loop();
}

function end(win) {
    state='END'; clearInterval(timer);
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    const t = document.getElementById('end-title');
    t.innerText = win ? CFG.winTxt : CFG.loseTxt;
    t.style.color = win ? '#0f0' : '#f00';
    document.getElementById('end-score').innerText = stats.sc;
    playSnd(win?'win':'lose');
    if(win) setInterval(() => {
        for(let i=0; i<10; i++) particles.push({
            x:Math.random()*w, y:Math.random()*h, dx:(Math.random()-0.5)*5, dy:(Math.random()-0.5)*5,
            l:1, s:Math.random()*5+2, c:'hsl('+Math.random()*360+',100%,50%)'
        });
    }, 300);
}

function updHUD() {
    document.getElementById('sc').innerText = stats.sc;
    document.getElementById('lv').innerText = '❤️'.repeat(stats.lv);
    const tm = document.getElementById('tm');
    tm.innerText = timeLeft;
    tm.className = timeLeft<=10 ? 'timer-warn' : '';
}

window.onmousemove = e => paddle.x = e.clientX - 60;
window.onclick = () => { if(state==='PLAY' && !ball.mov) { ball.mov=true; ball.dy=-CFG.speed; ball.dx=2; } };
function loop() { update(); draw(); requestAnimationFrame(loop); }
<\/script>
</body>
</html>`;

    // GENIALLY EMBED FIX
    // Use srcdoc with escaped quotes
    const embed = `<iframe srcdoc="${gameCode.replace(/"/g, '&quot;')}" width="100%" height="100%" frameborder="0"></iframe>`;
    
    navigator.clipboard.writeText(embed).then(() => {
        alert("КОД СКОПИРОВАН! Вставьте в Genially (Insert > Others).");
    });
}

init();
</script>
</body>
</html>
